/* ===== CONTABILIDAD (administrador) ===== */
const CONTA_GASTO = {alquiler:"Alquiler del local", nominas:"Nóminas", ss:"Seguridad Social", profesionales:"Gestoría y profesionales", seguros:"Seguros", publicidad:"Publicidad y web", software:"Software y suscripciones", vehiculos:"Vehículos y furgonetas", material:"Material y bicis", suministros:"Luz, agua y teléfono", bancos:"Bancos y comisiones", formacion:"Formación", otros:"Otros gastos"};
const CONTA_INGRESO = {bicis:"Alquiler de bicis", subvencion:"Subvenciones", otros:"Otros ingresos"};
const MODELO_RET = {alquiler:"115", nominas:"111", profesionales:"111"};
const MEDIOS_PROPIOS = ["repostaje","vehiculo","peaje"]; // gastos de los viajes que no son servicios para el viajero: IVA deducible, fuera del margen REAV
const qOf = f => Math.floor((+String(f).slice(5,7) - 1) / 3) + 1;
function tipoIS(year, tipo, base){
  if (base <= 0) return 0;
  if (tipo === "nueva") return base * 0.15;
  if (tipo === "general") return base * 0.25;
  if (tipo === "reducida") return base * ({2025:.24, 2026:.23, 2027:.22, 2028:.21}[year] ?? (year < 2025 ? .25 : .20));
  const [a, b] = year <= 2024 ? [.23, .23] : year === 2025 ? [.21, .22] : year === 2026 ? [.19, .21] : [.17, .20];
  return Math.min(base, 50000) * a + Math.max(0, base - 50000) * b;
}
const TIPO_EMPRESA = {micro:"Microempresa (facturación < 1 M€)", reducida:"Empresa de reducida dimensión (< 10 M€)", nueva:"Empresa de nueva creación (15 %)", general:"Tipo general (25 %)"};
async function loadConta(force){
  if (S.conta && !force) return;
  S.conta = {loading:true, trips:[], movs:[], cfg:{}};
  if (S.view === "conta" || S.view === "pend" || !S.vid) renderMain();
  const trips = [];
  for (const v of S.viajes){
    try {
      const base = `viajes/${v.id}`;
      const [c, h, g, fz] = await Promise.all(["clientes","hoteles","gastos","finanzas"].map(x => S.db.collection(base+"/"+x).get()));
      const fm = {}; fz.docs.forEach(d => fm[d.id] = d.data());
      trips.push({v, clientes:c.docs.map(d => ({id:d.id, ...d.data(), ...(fm[d.id]||{})})).filter(x => !x.guia), hoteles:h.docs.map(d => d.data()), gastos:g.docs.map(d => d.data())});
    } catch(e){ console.warn(e); }
  }
  let movs = [], cfg = {}, facturas = [];
  try { facturas = (await S.db.collection("facturas").get()).docs.map(d => ({id:d.id, ...d.data()})); } catch(e){ console.warn(e); }
  try { movs = (await S.db.collection("conta").get()).docs.map(d => ({id:d.id, ...d.data()})); } catch(e){ console.warn(e); }
  try { const s = await S.db.doc("contacfg/ajustes").get(); if (s.exists) cfg = s.data(); } catch(e){}
  S.conta = {loading:false, trips, movs, cfg, facturas, at:new Date()};
  if (!S.contaY) S.contaY = +todayIso.slice(0,4);
  if (S.contaQ === undefined) S.contaQ = qOf(todayIso);
  if (S.view === "conta" || S.view === "pend" || !S.vid) renderMain();
}
function contaCalc(year, q){
  const C = S.conta; const inP = f => f && +f.slice(0,4) === year && (!q || qOf(f) === q);
  const R = {ventas:0, costesReav:0, margen:0, ivaReav:0, ivaReavExento:0, propios:0, propiosIva:0, cobros:0, gGen:0, gGenIva:0, gGenNoDed:0, ret111:0, ret115:0, ingExtra:0, ingExtraIva:0, viajes:[], movs:[], recibidos:[], gViajes:0, gViajesIvaDed:0, gViajesIvaNoDed:0, facturas:[]};
  // gastos de los viajes (tickets, facturas recibidas y hoteles): cuentan en el trimestre de su propia fecha
  for (const T of C.trips){
    const hs = T.hoteles.filter(h => inP(h.fecha)), gs = T.gastos.filter(g => inP(g.fecha));
    if (!hs.length && !gs.length) continue;
    const prop = gs.filter(g => MEDIOS_PROPIOS.includes(g.categoria||"otros")), reav = gs.filter(g => !MEDIOS_PROPIOS.includes(g.categoria||"otros"));
    const tp = gastoTotals(prop), tr = gastoTotals(reav);
    const ivaDed = tp.iva10 + tp.iva21 + tp.ivaOtro, ivaNoDed = tr.iva10 + tr.iva21 + tr.ivaOtro;
    const hot = hs.reduce((a,h) => a + (+h.total||0), 0);
    const total = hot + tp.total + tr.total;
    R.gViajes += total - ivaDed; R.gViajesIvaDed += ivaDed; R.gViajesIvaNoDed += ivaNoDed;
    R.recibidos.push({v:T.v, n: gs.length + hs.length, nFact: gs.filter(g => g.tipo==="factura").length + hs.length, hot, tickets: tp.total + tr.total, total, ivaDed, ivaNoDed});
  }
  for (const T of C.trips){
    const v = T.v; if (!inP(v.inicio)) continue;
    const ventas = T.clientes.reduce((a,c) => a + (+c.precio||0), 0);
    const reavG = T.gastos.filter(g => !MEDIOS_PROPIOS.includes(g.categoria||"otros"));
    const propG = T.gastos.filter(g => MEDIOS_PROPIOS.includes(g.categoria||"otros"));
    const costes = T.hoteles.reduce((a,h) => a + (+h.total||0), 0) + reavG.reduce((a,g) => a + (+g.total||0), 0);
    const margen = ventas - costes, fuera = v.ivaZona === "fuera";
    const iva = !fuera && margen > 0 ? margen * 21 / 121 : 0;
    const pp = gastoTotals(propG); const ivaProp = pp.iva10 + pp.iva21 + pp.ivaOtro;
    R.ventas += ventas; R.costesReav += costes; R.margen += margen; R.ivaReav += iva; if (fuera) R.ivaReavExento += Math.max(0, margen);
    R.propios += pp.total; R.propiosIva += ivaProp;
    R.viajes.push({v, ventas, costes, margen, iva, fuera, propios:pp.total, propiosIva:ivaProp, resultado: ventas - iva - costes - (pp.total - ivaProp)});
  }
  for (const T of C.trips) for (const c of T.clientes) for (const p of (c.pagos||[])) if (inP(p.fecha)) R.cobros += +p.importe||0;
  for (const m of C.movs){
    if (!inP(m.fecha)) continue; R.movs.push(m);
    const base = +m.base||0, iva = +m.iva||0, irpf = +m.irpf||0;
    if (m.tipo === "ingreso"){ R.ingExtra += base; R.ingExtraIva += iva; continue; }
    R.gGen += base; if (m.deducible === false) R.gGenNoDed += iva; else R.gGenIva += iva;
    if (MODELO_RET[m.categoria] === "115") R.ret115 += irpf; else if (irpf) R.ret111 += irpf;
  }
  for (const f of (C.facturas||[])) if (inP(f.fecha)) R.facturas.push(f);
  R.facturas.sort((a,b) => String(b.numero).localeCompare(String(a.numero)));
  R.ivaPagar = R.ivaReav + R.ingExtraIva - R.gGenIva - R.gViajesIvaDed;
  R.gastosTot = R.gViajes + R.gGen + R.gGenNoDed;
  R.ingresosNetos = R.ventas - R.ivaReav + R.ingExtra;
  R.resultado = R.ingresosNetos - R.gastosTot;
  R.movs.sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
  R.viajes.sort((a,b) => String(a.v.inicio).localeCompare(String(b.v.inicio)));
  return R;
}
function contaPlazos(year, q, R, isPago){
  const y = year, L = [];
  const fx = (m, d1, d2, yy=y) => `${d1}–${d2} ${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1]} ${yy}`;
  const per = {1:fx(4,1,20), 2:fx(7,1,20), 3:fx(10,1,20), 4:fx(1,1,30,y+1)};
  const qs = q ? [q] : [1,2,3,4];
  for (const t of qs){
    const Rt = q ? R : contaCalc(y, t);
    L.push({m:"303", t:`IVA ${t}T ${y}`, imp:Rt.ivaPagar, plazo:per[t]});
    L.push({m:"111", t:`Retenciones nóminas y profesionales ${t}T`, imp:Rt.ret111, plazo:t===4?fx(1,1,20,y+1):per[t]});
    L.push({m:"115", t:`Retenciones de alquiler ${t}T`, imp:Rt.ret115, plazo:t===4?fx(1,1,20,y+1):per[t]});
    if (t !== 2) L.push({m:"202", t:`Pago fraccionado del Impuesto de Sociedades (${t===1?"1.º":t===3?"2.º":"3.º"})`, imp:isPago, plazo:t===1?fx(4,1,20):t===3?fx(10,1,20):fx(12,1,20), nota: isPago===null ? "Pon la cuota del último Impuesto de Sociedades en Ajustes" : ""});
    if (t === 2) L.push({m:"200", t:`Impuesto de Sociedades del ejercicio ${y-1}`, imp:null, plazo:fx(7,1,25), nota:"Lo calcula la gestoría con las cuentas cerradas"});
    if (t === 4) L.push({m:"390 · 190 · 180 · 347", t:"Resúmenes anuales", imp:null, plazo:`enero–febrero ${y+1}`});
  }
  return L;
}

async function facturaPdf(f){
  const {PDFDocument, rgb, StandardFonts} = PDFLib;
  const W = 595.28, H = 841.89, M = 48;
  const pdf = await PDFDocument.create(); const pg = pdf.addPage([W,H]);
  const fR = await pdf.embedFont(StandardFonts.Helvetica), fB = await pdf.embedFont(StandardFonts.HelveticaBold);
  const clean = t => String(t ?? "").replace(/[→]/g,"-").replace(/[^\x20-\x7E\u00A0-\u00FF€–—‘’“”•…]/g, "");
  const ink = rgb(.08,.08,.08), mut = rgb(.4,.42,.38), lime = rgb(.494,.647,.22);
  const T = (t, x, y, size=10, font=fR, color=ink) => pg.drawText(clean(t), {x, y, size, font, color});
  const R = (t, xr, y, size=10, font=fR, color=ink) => T(t, xr - font.widthOfTextAtSize(clean(t), size), y, size, font, color);
  const eur = n => new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"}).format(+n||0).replace(/\u00a0/g," ");
  const fdate = s => s ? s.split("-").reverse().join("/") : "";
  pg.drawRectangle({x:0, y:H-10, width:W, height:10, color:lime});
  try { const logo = await pdf.embedJpg(await (await fetch(document.querySelector(".brand-logo").src)).arrayBuffer()); pg.drawImage(logo, {x:M, y:H-110, width:150, height:150*logo.height/logo.width}); } catch(e){ T("TRAVEL BIKEX", M, H-70, 22, fB); }
  R("FACTURA", W-M, H-62, 24, fB); R(`Nº ${f.numero}`, W-M, H-82, 12, fB); R(`Fecha: ${fdate(f.fecha)}`, W-M, H-98, 10, fR, mut);
  let y = H-150;
  const block = (title, lines, x) => { let yy = y; T(title, x, yy, 8, fB, mut); yy -= 15; lines.filter(Boolean).forEach((l,i) => { T(l, x, yy, i===0?11:10, i===0?fB:fR); yy -= 14; }); return yy; };
  const e = f.emisor, c = f.cliente;
  const y1 = block("EMISOR", [e.razon, e.nif?`NIF: ${e.nif}`:"", e.direccion, e.cp, [e.telefono, e.email].filter(Boolean).join(" · "), e.licencia?`Licencia: ${e.licencia}`:""], M);
  const y2 = block("CLIENTE", [c.nombre, c.nif?`DNI / NIF: ${c.nif}`:"", c.direccion, c.cp, c.email], W/2+10);
  y = Math.min(y1, y2) - 24;
  pg.drawRectangle({x:M, y:y-6, width:W-2*M, height:22, color:ink});
  T("CONCEPTO", M+10, y, 9, fB, rgb(1,1,1)); R("IMPORTE", W-M-10, y, 9, fB, rgb(1,1,1)); y -= 26;
  const words = clean(f.concepto).split(" "); let line = "", lines = [];
  words.forEach(w => { const t = line ? line+" "+w : w; if (fR.widthOfTextAtSize(t, 11) > W-2*M-140) { lines.push(line); line = w; } else line = t; }); if (line) lines.push(line);
  lines.forEach((l,i) => { T(l, M+10, y - i*15, 11); }); R(eur(f.importe), W-M-10, y, 11, fB); y -= lines.length*15 + 12;
  pg.drawLine({start:{x:M, y}, end:{x:W-M, y}, thickness:.6, color:mut}); y -= 26;
  T("TOTAL FACTURA", W-M-230, y, 12, fB); R(eur(f.importe), W-M-10, y, 14, fB); y -= 18;
  T("IVA incluido. Régimen especial de las agencias de viajes.", W-M-230, y, 8.5, fR, mut); y -= 34;
  T("Régimen especial de las agencias de viajes (art. 141 y siguientes de la Ley 37/1992 del IVA).", M, y, 9, fB); y -= 14;
  T("La cuota de IVA no se desglosa en la factura.", M, y, 9, fR, mut); y -= 26;
  if (f.pagos && f.pagos.length) { T("PAGOS RECIBIDOS", M, y, 8, fB, mut); y -= 14; f.pagos.forEach(p => { T(`${fdate(p.fecha)}  ${p.metodo||""}`, M, y, 9.5); R(eur(p.importe), M+260, y, 9.5); y -= 13; }); y -= 10; }
  if (e.iban) { T(`Forma de pago: transferencia a ${e.iban}`, M, y, 9.5); y -= 14; }
  T(`${e.razon||""}${e.nif?` · NIF ${e.nif}`:""} · ${e.cp||""}`, M, 40, 7.5, fR, mut);
  return new Blob([await pdf.save()], {type:"application/pdf"});
}

function fueraDeFechas(v){
  if (!v.inicio || !v.fin) return {n:0};
  const fuera = f => f && (f < v.inicio || f > v.fin);
  const et = Object.keys(S.etapas).filter(k => fuera(k) && dayHas(S.etapas[k])), ho = S.hoteles.filter(h => fuera(h.fecha));
  const all = [...et, ...ho.map(h => h.fecha), ...Object.keys(S.compra).filter(fuera)].sort();
  return {n: et.length + ho.length, et: et.length, ho: ho.length, primero: all[0]};
}
function fueraBanner(v){

  const F = fueraDeFechas(v); if (!F.n) return "";
  const off = Math.round((parse(v.inicio) - parse(F.primero)) / 86400000);
  return `<div class="alert" style="margin:0 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between"><p style="margin:0"><b>Hay datos fuera de las fechas del viaje:</b> ${F.et} día${F.et===1?"":"s"} del programa y ${F.ho} hotel${F.ho===1?"":"es"} empiezan el ${esc(fD.format(parse(F.primero)))}. No se ha borrado nada.</p><button class="btn pri sm" style="--sec:var(--due)" data-act="fixFechas" data-off="${off}">Moverlos para que empiecen el ${esc(fD.format(parse(v.inicio)))}</button></div>`;
}
async function moverFechas(off){
  if (!off) return;
  const base = `viajes/${S.vid}`;
  for (const [col, src] of [["etapas", S.etapas], ["compra", S.compra], ["rooming", S.rooming]]) {
    const entries = Object.entries(src||{}).map(([k, v]) => [k, JSON.parse(JSON.stringify(v))]);
    const nuevos = new Set(entries.map(([k]) => addDays(k, off)));
    for (const [k, v] of entries) await S.db.doc(`${base}/${col}/${addDays(k, off)}`).set(v);
    for (const [k] of entries) if (!nuevos.has(k)) await S.db.doc(`${base}/${col}/${k}`).delete();
  }
  for (const h of S.hoteles) if (h.fecha) { const {id, ...rest} = h; await S.db.doc(`${base}/hoteles/${id}`).set({...rest, fecha:addDays(h.fecha, off)}); }
}

// Track files (GPX, KML, KMZ, FIT, TCX…) aren't a storable media type, so they are kept as base64 text and rebuilt on download.
async function uploadTrack(f){
  const bytes = new Uint8Array(await f.arrayBuffer());
  let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000));
  const r = await S.assets.upload(new Blob([btoa(bin)], {type:"text/plain"}), {type:"text/plain"});
  return {id:r.id, nombre:f.name, size:f.size, enc:"b64"};
}
async function dlTracks(f, did){
  if (!window.JSZip) return toast("No se pudo cargar el compresor. Recarga la página.");
  const e = S.etapas[f] || {}; const list = (e.tracks||[]).filter(d => !did || d.id===did);
  if (!list.length) return;
  toast("Preparando descarga…");
  try {
    const zip = new JSZip(); const used = {};
    for (const d of list){
      const txt = await (await fetch("/_blob/" + d.id)).text();
      const bin = atob(txt.trim()); const u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
      let name = d.nombre || "track.gpx"; if (used[name]) name = name.replace(/(\.[^.]*)?$/, `_${used[name]}$1`); used[d.nombre] = (used[d.nombre]||0)+1;
      zip.file(name, u8);
    }
    const ds = dias(trip()); const n = ds.indexOf(f)+1;
    const base = list.length===1 ? list[0].nombre.replace(/\.[^.]*$/,"") : `Tracks_dia${n}_${slug(trip().nombre)}`;
    await saveFile(`${slug(base)||"track"}.zip`, await zip.generateAsync({type:"blob"}), list.length===1?"Track descargado":"Tracks descargados");
  } catch(err){ console.warn(err); toast("No se pudo preparar la descarga del track."); }
}
function delFile(kind, owner, did){
  const path = kind==="cliente" ? `viajes/${S.vid}/clientes/${owner}` : `viajes/${S.vid}/etapas/${owner}`;
  const field = {cliente:"docs", etapa:"files", track:"tracks"}[kind];
  mutateDoc(path, cur => ({...cur, [field]:(cur[field]||[]).filter(d=>d.id!==did)}))

async function saveFile(filename, data, okMsg){

}
async function bundle(){
  if (!window.PDFLib) return toast("No se pudo cargar el generador de PDF. Recarga la página.");
  S.busy = true; renderMain();
  try {
    const {PDFDocument, rgb, StandardFonts} = PDFLib;
    const out = await PDFDocument.create(); const font = await out.embedFont(StandardFonts.HelveticaBold);
    const skipped = [];
    for (const c of sortedClients()) for (const d of (c.docs||[])){
      try {
        const buf = await (await fetch("/_blob/" + d.id)).arrayBuffer();
        if (/pdf/.test(d.tipo)){ const src = await PDFDocument.load(buf, {ignoreEncryption:true}); (await out.copyPages(src, src.getPageIndices())).forEach(p => out.addPage(p)); }
        else {
          const img = /png/.test(d.tipo) ? await out.embedPng(buf) : await out.embedJpg(buf);
          const page = out.addPage([595.28, 841.89]); const sc = Math.min(535/img.width, 760/img.height, 1);
          page.drawImage(img, {x:(595.28-img.width*sc)/2, y:(800-img.height*sc)/2+10, width:img.width*sc, height:img.height*sc});
          page.drawText(`${pad2(c.num)} - ${c.nombre}`.normalize("NFD").replace(/[̀-ͯ]/g,""), {x:30, y:815, size:12, font, color:rgb(.1,.1,.1)});
        }
      } catch(e){ console.warn(e); skipped.push(d.nombre); }
    }
    if (!out.getPageCount()) toast("No se pudo leer ningún documento.");
    else await saveFile(`Documentacion_${slug(trip().nombre)}_${S.sendDay||""}.pdf`, new Blob([await out.save()]), skipped.length ? `PDF listo. No se pudieron incluir: ${skipped.join(", ")}` : "PDF descargado");
  } catch(e){ console.warn(e); toast("No se pudo generar el PDF."); }
  S.busy = false; renderMain();
}
function csv(){
  const v = trip(); const num = n => (r2(n)).toFixed(2).replace(".",",");
  const rows = [["Fecha","Categoría","Tipo","Establecimiento","Método de pago","Pagado por","Base imponible","IVA %","Cuota IVA","Total","Foto","Notas"]];
  [...S.gastos].sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha))).forEach(g => { const p = ivaParts(g);
    rows.push([g.fecha, CATS[g.categoria]||"Otros", g.tipo==="factura"?"Factura":"Ticket", g.concepto||"", g.metodo||"", g.pagadoPor||"", num(p.base), p.pct, num(p.cuota), num(g.total), g.foto?"Sí":"No", g.notas||""]); });
  const t = gastoTotals(S.gastos); rows.push([]); rows.push(["TOTAL","","","","","",num(t.base),"",num(t.iva10+t.iva21+t.ivaOtro),num(t.total),"",""]);
  const txt = "﻿" + rows.map(r => r.map(x => { const s = String(x??""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; }).join(";")).join("\r\n");
  saveFile(`Gastos_${slug(v.nombre)}.csv`, txt, "Gastos descargados");
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]");
  if (!b) { if (ev.target.id==="modal") closeModal(); return; }
  const a = b.dataset.act;
  if (a!=="del" && a!=="delFile" && a!=="delPago" && a!=="teamDel" && S.armed && !String(S.armed).startsWith("doc")) S.armed = null;
  const ADMIN_ACTS = ["conta","contaReload","contaAjustes","contaCsv","contaMov","contaEdit","contaDel","contaY","contaQ","factura","fixFechas","publico","unpublish","inscReload","inscFile","inscAdd","inscDel","pend","reloadPend","newTrip","editTrip","general","reloadGen","genYear","newHotel","newClient","editEtapa","upload","delFile","cFirm","cUndo","cMarkSent","pagos","delPago","team","teamDel"];
  if (!isAdmin() && (ADMIN_ACTS.includes(a) || (a==="del" && b.dataset.kind!=="gasto"))) { toast("Esto solo lo puede hacer el administrador."); return; }
  switch(a){
    case "team": await loadTeam(); teamForm(); break;
    case "teamDel": { const e = b.dataset.e, k = "tm"+e; if (S.armed!==k){ S.armed=k; teamForm(); break; } S.armed=null;
      try { await window.TBX_TEAM.remove(e); await loadTeam(); toast("Acceso quitado"); teamForm(); } catch(err){ writeErr(err); } break; }
    case "open": openTrip(b.dataset.id); break;
    case "general": closeTrip(); S.view="general"; S.general=null; renderAll(); window.scrollTo(0,0); break;
    case "reloadGen": loadGeneral(); break;
    case "pend": closeTrip(); S.view="pend"; S.pend=null; try{localStorage.removeItem("tbx_vid");}catch(e){} renderAll(); window.scrollTo(0,0); break;
    case "reloadPend": loadPend(); break;
    case "goto": openTrip(b.dataset.id); S.tab = b.dataset.t; renderMain(); window.scrollTo(0,0); break;
    case "gotoAct": openTrip(b.dataset.id); if (b.dataset.a==="editTrip") { await loadTeam(); tripForm(trip()); } break;
    case "gotoTab": S.tab = b.dataset.t; renderMain(); window.scrollTo(0,0); break;
    case "gotoDay": S.day.eta = b.dataset.f; S.tab = "etapas"; renderMain(); window.scrollTo(0,0); break;
    case "gotoShop": S.day.com = b.dataset.f; S.tab = "compra"; renderMain(); window.scrollTo(0,0); break;
    case "rooming": roomingForm(); break;
    case "conta": closeTrip(); S.view="conta"; try{localStorage.removeItem("tbx_vid");}catch(e){} renderAll(); window.scrollTo(0,0); break;
    case "contaReload": loadConta(true); break;
    case "contaY": S.contaY = +b.dataset.y; renderMain(); break;
    case "contaQ": S.contaQ = +b.dataset.q; renderMain(); break;
    case "contaAjustes": contaAjustesForm(); break;
    case "contaCsv": contaCsv(); break;
    case "contaMov": contaMovForm({tipo:b.dataset.t, categoria: b.dataset.t==="ingreso"?"otros":"alquiler"}); break;
    case "contaEdit": contaMovForm({...(S.conta.movs.find(x => x.id===b.dataset.id)||{})}); break;
    case "contaDel": { if (S.armed !== "cdel"){ S.armed = "cdel"; b.classList.add("armed"); b.textContent = "Pulsa otra vez para borrar"; break; } S.armed = null;
      const id = S.modal.id; try { await S.db.doc(`conta/${id}`).delete(); S.conta.movs = S.conta.movs.filter(x => x.id !== id); closeModal(); renderMain(); toast("Borrado"); } catch(e){ writeErr(e); } break; }
    case "factura": facturaForm(b.dataset.id); break;
    case "fixFechas": { b.disabled = true; b.textContent = "Moviendo…"; try { await moverFechas(+b.dataset.off); toast("Programa y hoteles movidos a las fechas del viaje"); } catch(e){ writeErr(e); } break; }
    case "editBici": biciForm(b.dataset.id); break;
    case "biciTg": { const c = S.clientes.find(x => x.id===b.dataset.id); if (!c) break; const k = b.dataset.k, on = !biciOf(c)[k];
      mutateDoc(biciPath(c.id), cur => ({...cur, [k]:on})).catch(writeErr); break; }
    case "biciCsv": biciCsv(); break;
    case "publico": publicoForm(); break;
    case "unpublish": { if (S.armed !== "unpub"){ S.armed = "unpub"; b.classList.add("armed"); b.textContent = "Pulsa otra vez para despublicar"; break; } S.armed = null;
      const v = trip(), sg = pubOf(v).slug;
      try { await TBX_PUB.unpublish(sg); await TBX_PUB.clear(sg).catch(()=>{}); await S.db.doc("viajes/"+v.id).update({publico:{...pubOf(v), publicado:false, inscripcion:false}, paginaClientes:""}); closeModal(); toast("Página despublicada"); } catch(e){ writeErr(e); } break; }
    case "inscReload": loadInsc(true); break;
    case "inscFile": { const w = window.open("", "_blank"); TBX_PUB.fileUrl(b.dataset.p).then(u => { if (w) w.location = u; else location.href = u; }, () => { if (w) w.close(); toast("No se pudo abrir el archivo."); }); break; }
    case "inscAdd": b.disabled = true; await inscAdd(b.dataset.id); break;
    case "inscDel": { const k = "insc"+b.dataset.id; if (S.armed !== k){ S.armed = k; renderMain(); break; } S.armed = null;
      const i = S.insc.list.find(x => x.id===b.dataset.id); try { await TBX_PUB.setEstado(i.id, "descartada"); TBX_PUB.removeFiles(((i.data||{}).archivos||[]).map(a=>a.path)).catch(()=>{}); i.estado = "descartada"; renderMain(); toast("Inscripción descartada"); } catch(e){ writeErr(e); } break; }
    case "genYear": S.genYear = b.dataset.y || null; renderMain(); break;
    case "back": closeTrip(); S.view="trip"; try{localStorage.removeItem("tbx_vid");}catch(e){} renderAll(); break;
    case "tab": S.tab = b.dataset.t; try{localStorage.setItem("tbx_tab",S.tab);}catch(e){} renderMain(); break;
    case "day": S.day[b.dataset.k] = b.dataset.f; if (b.dataset.k==="room") S.lrMode="dia"; renderMain(); break;
    case "newTrip": await loadTeam(); await loadPlantillas(); tripForm(null); break;
    case "editTrip": await loadTeam(); tripForm(trip()); break;
    case "close": closeModal(); break;
    case "newHotel": hotelForm({fecha:b.dataset.f, grupo:b.dataset.g}); break;
    case "editHotel": hotelForm(S.hoteles.find(h=>h.id===b.dataset.id)||{}); break;
    case "allPaid": $("#pagado").value = $("#total").value || 0; updCalc(); break;
    case "newClient": clientForm({}); break;
    case "editClient": clientForm(S.clientes.find(c=>c.id===b.dataset.id)||{}); break;
    case "newGasto": gastoForm({}); break;
    case "editGasto": gastoForm({...S.gastos.find(g=>g.id===b.dataset.id)}); break;
    case "gCat": S.gCat = b.dataset.c ? (S.gCat===b.dataset.c ? null : b.dataset.c) : null; renderMain(); break;
    case "csv": csv(); break;
    case "editEtapa": etapaForm(b.dataset.f); break;
    case "del": if (S.armed==="del"+b.dataset.kind) doDelete(b.dataset.kind); else { S.armed="del"+b.dataset.kind; b.classList.add("armed"); b.textContent = b.dataset.kind==="trip"?"Pulsa otra vez: se borra todo el viaje":"Pulsa otra vez para borrar"; } break;
    case "delFile": { const k="doc"+b.dataset.did; if (S.armed===k){ S.armed=null; delFile(b.dataset.kind,b.dataset.id,b.dataset.did);} else { S.armed=k; renderMain(); } break; }
    case "upload": { uploadTarget = {kind:b.dataset.kind, id:b.dataset.id}; const fp = $("#filepick");
      fp.accept = b.dataset.kind==="track" ? ".gpx,.kml,.kmz,.fit,.tcx,.geojson,.trk,.plt" : b.dataset.kind==="plantilla" ? "application/pdf" : "application/pdf,image/jpeg,image/png";
      fp.multiple = !(b.dataset.kind==="plantilla" || b.dataset.kind==="firmado");
      fp.click(); break; }
    case "dlTracks": dlTracks(b.dataset.f, b.dataset.did); break;
    case "cFirm": mutateDoc(`viajes/${S.vid}/clientes/${b.dataset.id}`, cur => ({...cur, consent:{...(cur.consent||{}), estado:"firmado", firmado:todayIso}})).then(()=>toast("Marcado como firmado"), writeErr); break;
    case "cUndo": { const k = "cu"+b.dataset.id; if (S.armed!==k){ S.armed=k; renderMain(); break; } S.armed=null;
      mutateDoc(`viajes/${S.vid}/clientes/${b.dataset.id}`, cur => { const c0 = cur.consent||{}; return {...cur, consent:{estado: c0.enviado?"enviado":"", enviado:c0.enviado||""}}; }).then(()=>toast("Firma quitada"), writeErr); break; }
    case "cMarkSent": { const ids = S.clientes.filter(c => !c.guia && ((c.consent||{}).estado||"")!=="firmado" && (c.email||"").trim()).map(c => c.id);
      Promise.all(ids.map(id => mutateDoc(`viajes/${S.vid}/clientes/${id}`, cur => ({...cur, consent:{...(cur.consent||{}), estado:"enviado", enviado:todayIso}})))).then(()=>toast(`Marcado como enviado a ${ids.length}`), writeErr); break; }
    case "pagos": pagosForm(b.dataset.id); break;
    case "delPago": { const k = "pay"+b.dataset.id, cid = S.modal && S.modal.id; if (!cid) break;
      if (S.armed !== k) { S.armed = k; b.classList.add("armed"); b.textContent = "¿Borrar?"; break; }
      S.armed = null;
      mutateDoc(finPath(cid), cur => { const pagos = (cur.pagos||[]).filter(p => p.id!==b.dataset.id); return {...cur, pagos, cobrado: r2(pagos.reduce((a,p)=>a+(+p.importe||0),0))}; })
        .then(() => { toast("Pago borrado"); setTimeout(()=>{ if (S.modal && S.modal.kind==="pagos") pagosForm(cid); }, 150); }, writeErr);
      break; }
    case "copy": try { await navigator.clipboard.writeText(b.dataset.v); toast(b.dataset.v.length > 120 ? "Mensaje copiado" : "Copiado"); } catch(e){ const r=document.createRange(); r.selectNodeContents(b.previousElementSibling); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Email seleccionado: cópialo con el menú"); } break;
    case "bundle": bundle(); break;
    case "lrMode": S.lrMode = b.dataset.m; renderMain(); break;
    case "lrFilter": S.lrFilter = b.dataset.x; renderMain(); break;
    case "tg": { const g = tagGroups().find(x => x.key===b.dataset.g); if (!g) break; const r = roomOfG(b.dataset.f, g); writeRoomG(b.dataset.f, g, {[b.dataset.k]: !r[b.dataset.k]}); break; }
    case "copyRooms": { const f=b.dataset.f, p=b.dataset.prev; const gs = tagGroups().filter(g => roomOfG(p,g).hab && !roomOfG(f,g).hab);
        if (!gs.length) { toast("No hay habitaciones nuevas que copiar."); break; }
        for (const g of gs) await writeRoomG(f, g, {hab:roomOfG(p,g).hab}); toast(`${gs.length} habitaciones copiadas`); break; }
    case "shopTg": mutateShop(b.dataset.f, it => it.map(x => x.id===b.dataset.i ? {...x, ok:!x.ok} : x)); break;
    case "shopDel": mutateShop(b.dataset.f, it => it.filter(x => x.id!==b.dataset.i)); break;
    case "shopReset": mutateShop(S.day.com, it => it.map(x => ({...x, ok:false}))); break;
    case "shopClear": mutateShop(S.day.com, it => it.filter(x => !x.ok)); break;
  }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.classList.contains("room-in")) { const g = tagGroups().find(x => x.key===t.dataset.g); if (g) { const r = roomOfG(t.dataset.f, g); const v = t.value.trim(); if ((r.hab||"") !== v) writeRoomG(t.dataset.f, g, {hab:v}); } }
  if (t.classList.contains("pay-in")) { const k = t.dataset.k; const val = k==="notaPago" ? t.value.trim() : r2(t.value);
    mutateDoc(finPath(t.dataset.cid), cur => ({...cur, [k]:val})).catch(writeErr); }
  if (t.id === "sendDay") { S.sendDay = t.value; renderMain(); }
  if (t.id === "copyFrom" && t.value) { const src = ((S.compra[t.value]||{}).items)||[]; const f = S.day.com;
    mutateShop(f, it => { const have = new Set(it.map(x=>x.t.toLowerCase())); return [...it, ...src.filter(x=>!have.has(x.t.toLowerCase())).map(x=>({...x, id:Date.now().toString(36)+Math.random().toString(36).slice(2,6), ok:false}))]; }).then(()=>toast("Lista copiada")); }
  if (t.name === "cat") { $("#g-cat").value = t.value; if ($("#g-coniva") && $("#g-coniva").checked) $("#g-iva").value = CAT_IVA[t.value]; updCalc(); }
  if (t.id === "g-coniva") { if (t.checked) $("#g-iva").value = CAT_IVA[$("#g-cat").value]||21; updCalc(); }
  if (t.closest && t.closest("#frm") && /^(cm-base|cm-ivap|cm-irpfp|cm-irpf)$/.test(t.id)) contaCalcForm();
  if (t.id === "g-iva") updCalc();
  if (t.name === "tipoDia") setTipoForm(t.value);
  if (t.id === "g-cam" || t.id === "g-file") { const f = t.files[0]; if (!f) return; S.pendingFile = f;
    const prev = $("#phPrev"); if (/^image/.test(f.type)) { const u = URL.createObjectURL(f); prev.innerHTML = `<img src="${u}" alt="Ticket nuevo">`; } else prev.innerHTML = '<div class="ph">PDF<br>listo</div>'; }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#modal").hidden) closeModal();
  if (ev.key === "Enter" && (ev.target.classList.contains("room-in") || ev.target.classList.contains("pay-in"))) ev.target.blur();
});
document.addEventListener("input", ev => { if (["total","pagado","g-total"].includes(ev.target.id)) updCalc(); if (["cm-base","cm-irpf"].includes(ev.target.id)) { if (ev.target.id==="cm-irpf" && $("#cm-irpfp")) $("#cm-irpfp").value = "otro"; contaCalcForm(); } });
document.addEventListener("submit", ev => { ev.preventDefault(); submitForm(ev.target); });

/* ---------- boot ---------- */
renderAll();
(async () => {
  if (!window.claude || !window.claude.use) { setSync("off","Sin conexión"); renderAll(); return; }
  S.db = await window.claude.use("db");
  if (!S.db) { setSync("off","Sin conexión"); renderAll(); return; }
  setSync("","Cargando…"); renderAll();
  subscribeTrips(); loadConsentGlobal();
  loadTeam().then(() => renderAll());
  window.claude.use("assets").then(a => { S.assets = a; renderMain(); });
  window.claude.use("downloads").then(d => { S.downloads = d; });
})();
})();
</script>
