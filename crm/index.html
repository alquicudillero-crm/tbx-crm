<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TRAVEL BIKEX CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: cuaderno de ruta — menú de viajes a la izquierda (arriba en móvil); cada viaje abre sus apartados como pestañas de colores, cada apartado con su propio color */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --sunk:#e8eae3; --ink:#161714; --muted:#5d6158; --line:#d7dad1;
  --accent:#5c8a1c; --accent-ink:#ffffff;
  --brand-black:#000000; --brand-green:#7ea538; --brand-lime:#b5c036; --brand-grad:linear-gradient(90deg,#7ea538,#b5c036);
  --paid:#1c5fd0; --paid-bg:#e5eefc; --due:#d0342a; --due-bg:#fde9e7;
  --half:#b26b00; --half-bg:#fff0d6; --ok:#1f8a45; --ok-bg:#e1f5e8;
  --s-hot:#3b5bdb; --s-hot-bg:#e8edff;
  --s-eta:#2b8a3e; --s-eta-bg:#e3f6e6;
  --s-gas:#e8590c; --s-gas-bg:#fff0e6;
  --s-com:#c2255c; --s-com-bg:#fde8f0;
  --s-cli:#0b7f92; --s-cli-bg:#e0f5f8;
  --s-room:#d98a00; --s-room-bg:#fff4dc;
  --s-bal:#6741d9; --s-bal-bg:#efeaff;
  --s-bic:#5c8a00; --s-bic-bg:#eef7d9;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,35,28,.06),0 6px 18px rgba(20,35,28,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f100e; --surface:#191b17; --sunk:#131512; --ink:#ebece8; --muted:#9ea398; --line:#2b2e28;
  --accent:#a4c64a; --accent-ink:#0b0f05;
  --paid:#7aaaff; --paid-bg:#172540; --due:#ff7f73; --due-bg:#3a1c1a;
  --half:#f2b759; --half-bg:#372912; --ok:#6fd291; --ok-bg:#15301f;
  --s-hot:#8ea4ff; --s-hot-bg:#1c2448; --s-eta:#73d488; --s-eta-bg:#16301c;
  --s-gas:#ff9a5c; --s-gas-bg:#3a2214; --s-com:#ff7aa8; --s-com-bg:#3a1828;
  --s-cli:#5fd3e6; --s-cli-bg:#10313a; --s-room:#ffc24d; --s-room-bg:#382a0e;
  --s-bal:#b39dff; --s-bal-bg:#271f45; --s-bic:#b5d94a; --s-bic-bg:#25300f;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f100e; --surface:#191b17; --sunk:#131512; --ink:#ebece8; --muted:#9ea398; --line:#2b2e28;
  --accent:#a4c64a; --accent-ink:#0b0f05;
  --paid:#7aaaff; --paid-bg:#172540; --due:#ff7f73; --due-bg:#3a1c1a;
  --half:#f2b759; --half-bg:#372912; --ok:#6fd291; --ok-bg:#15301f;
  --s-hot:#8ea4ff; --s-hot-bg:#1c2448; --s-eta:#73d488; --s-eta-bg:#16301c;
  --s-gas:#ff9a5c; --s-gas-bg:#3a2214; --s-com:#ff7aa8; --s-com-bg:#3a1828;
  --s-cli:#5fd3e6; --s-cli-bg:#10313a; --s-room:#ffc24d; --s-room-bg:#382a0e;
  --s-bal:#b39dff; --s-bal-bg:#271f45; --s-bic:#b5d94a; --s-bic-bg:#25300f;
  --shadow:0 1px 2px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sec,var(--accent));outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
a{color:inherit}

.sec-hoteles{--sec:var(--s-hot);--sec-bg:var(--s-hot-bg)}
.sec-etapas{--sec:var(--s-eta);--sec-bg:var(--s-eta-bg)}
.sec-gastos{--sec:var(--s-gas);--sec-bg:var(--s-gas-bg)}
.sec-compra{--sec:var(--s-com);--sec-bg:var(--s-com-bg)}
.sec-clientes{--sec:var(--s-cli);--sec-bg:var(--s-cli-bg)}
.sec-room{--sec:var(--s-room);--sec-bg:var(--s-room-bg)}
.sec-balance{--sec:var(--s-bal);--sec-bg:var(--s-bal-bg)}

/* top bar + jersey stripe */
.top{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--brand-black);color:#ffffff}
.brand-logo{height:46px;width:auto;display:block}
.brand{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.09em;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.03em;opacity:.85;text-transform:none}
.stripe{height:5px;background:var(--brand-grad)}
.stripe i:nth-child(1){background:var(--s-hot)}.stripe i:nth-child(2){background:var(--s-eta)}.stripe i:nth-child(3){background:var(--s-gas)}.stripe i:nth-child(4){background:var(--s-com)}.stripe i:nth-child(5){background:var(--s-cli)}.stripe i:nth-child(6){background:var(--s-room)}.stripe i:nth-child(7){background:var(--s-bal)}
.sync{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.92}
.sync i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.5}
.sync.on i{opacity:1;background:#b5c036} .sync.off i{background:#ffb4a8;opacity:1}

.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:calc(100vh - 58px)}
aside{--ink:#f1f2ee;--muted:#a3a89d;--line:#2c2e29;--surface:#1d1f1b;--sunk:#141513;--accent:#b5c036;--ok:#9fd36b;--ok-bg:#1f2d14;color:var(--ink);border-right:1px solid #000;background:#0b0b0b;padding-block:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;display:flex;flex-direction:column;gap:12px}
main{min-width:0;padding-block:22px 70px;padding-left:28px;padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside{border-right:0;padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-top:14px}
  .layout.trip-open aside{display:none}
  .layout:not(.trip-open) main{display:none}
}
@media (min-width:861px){.only-mobile{display:none!important}}

.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.trip-list{display:flex;flex-direction:column;gap:6px}
.trip-item{display:grid;grid-template-columns:5px 1fr;gap:10px;text-align:left;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:9px 10px 9px 8px;cursor:pointer;width:100%}
.trip-item:hover{background:var(--surface);border-color:var(--line)}
.trip-item.sel{background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.trip-item .rail{border-radius:3px;background:var(--line)}
.trip-item.t-bici .rail{background:var(--s-eta)} .trip-item.t-emtb .rail{background:var(--s-bic)} .trip-item.t-trek .rail{background:var(--s-gas)} .trip-item.t-otro .rail{background:var(--s-bal)}
.trip-item b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.trip-item span{font-size:12.5px;color:var(--muted)}
.gen-btn{display:flex;align-items:center;gap:10px;border:0;border-radius:var(--r);padding:12px 14px;background:var(--brand-grad);color:#0b0b0b;font-weight:800;cursor:pointer;text-align:left;width:100%}
.gen-btn.sel{box-shadow:0 0 0 3px #ffffff}
.rol-guia .admin-only{display:none!important}
.team-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid #2c2e29;border-radius:var(--r);background:#141513;color:#f1f2ee;padding:10px 14px;font-weight:700;cursor:pointer;text-align:left}
.team-btn:hover{border-color:#b5c036}
.team-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.team-row .who{flex:1 1 180px;min-width:0}
.team-row .who b{display:block;overflow:hidden;text-overflow:ellipsis}
.ro-note{grid-column:1/-1;background:var(--sunk);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted)}
.gen-btn span{font-weight:500;font-size:12px;opacity:.9;display:block}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.live{background:var(--ok-bg);color:var(--ok)} .chip.bici{background:var(--s-eta-bg);color:var(--s-eta)} .chip.trek{background:var(--s-gas-bg);color:var(--s-gas)} .chip.otro{background:var(--s-bal-bg);color:var(--s-bal)}
.chip.due{background:var(--due-bg);color:var(--due)} .chip.paid{background:var(--paid-bg);color:var(--paid)} .chip.okc{background:var(--ok-bg);color:var(--ok)}
.chip.es{background:var(--half-bg);color:var(--half)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--sec,var(--accent));border-color:var(--sec,var(--accent));color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0d1210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#0d1210}}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent} .btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--due);border-color:var(--due-bg)} .btn.danger.armed{background:var(--due);color:#fff;border-color:var(--due)}
.btn.sm{padding:4px 9px;font-size:12.5px} .btn.big{padding:12px 18px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* trip header + tabs */
.trip-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:14px}
.trip-head h1{font-size:34px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em}
.trip-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px;color:var(--muted);font-size:13.5px}
.trip-head .actions{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--sec)}
.tab:hover{border-color:var(--sec)}
.tab.on{background:var(--sec);border-color:var(--sec);color:#fff}
:root[data-theme="dark"] .tab.on{color:#0d1210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab.on{color:#0d1210}}
.tab.on .dot{background:currentColor}
.tab .chip{font-family:var(--f-body);text-transform:none;letter-spacing:0}
.tab.on .chip{background:rgba(255,255,255,.25);color:inherit}
.sec-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;border-radius:var(--r);background:var(--sec-bg);padding:14px 18px;margin-bottom:16px;border-left:6px solid var(--sec)}
.sec-title h2{font-size:24px;text-transform:uppercase;color:var(--sec)}
.sec-title p{margin:0;color:var(--muted);font-size:13px;flex:1 1 260px}
.sec-title .acts{display:flex;gap:8px;flex-wrap:wrap}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;border-top:4px solid var(--tc,var(--line))}
.tile .v{font-family:var(--f-mono);font-weight:600;font-size:20px;line-height:1.2;color:var(--tc,var(--ink))}
.tile small{color:var(--muted);font-size:12px}
.tile.big .v{font-size:26px}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* day picker */
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px}
.day-btn{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;text-align:center;min-width:80px;position:relative}
.day-btn b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.1}
.day-btn span{font-size:11.5px;color:var(--muted)}
.day-btn.on{border-color:var(--sec);background:var(--sec-bg);box-shadow:inset 0 0 0 1px var(--sec)}
.day-btn.on b{color:var(--sec)}
.day-btn i{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%}
.day-btn i.done{background:var(--ok)} .day-btn i.part{background:var(--half)} .day-btn i.none{background:var(--due)} .day-btn i.fut{background:var(--line)} .day-btn i.has{background:var(--sec)}
.day-btn.today::after{content:"HOY";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;background:var(--ink);color:var(--bg);padding:0 5px;border-radius:4px;letter-spacing:.05em}

/* hotels */
.nights{display:flex;flex-direction:column;gap:14px}
.night{display:grid;grid-template-columns:100px minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.night-date{padding-top:8px}
.night-date .d{font-family:var(--f-display);font-weight:800;font-size:23px;line-height:1;text-transform:uppercase;color:var(--s-hot)}
.night-date .w{font-size:12.5px;color:var(--muted)}
.slot{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hotel{border:1px solid var(--line);border-left:6px solid var(--line);background:var(--surface);border-radius:var(--r);padding:11px 13px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:6px}
.hotel:hover{box-shadow:var(--shadow)}
.hotel.paid{border-left-color:var(--paid);background:linear-gradient(90deg,var(--paid-bg),var(--surface) 75%)}
.hotel.due{border-left-color:var(--due);background:linear-gradient(90deg,var(--due-bg),var(--surface) 75%)}
.hotel .hn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hotel .hn b{font-size:15px}
.hotel .st{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;color:#fff}
.hotel.paid .st{background:var(--paid)} .hotel.due .st{background:var(--due)}
:root[data-theme="dark"] .hotel .st{color:#0d1210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hotel .st{color:#0d1210}}
.hotel .rooms{font-size:13px}
.hotel .facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.hotel .money{display:flex;gap:14px;font-family:var(--f-mono);font-size:12.5px;flex-wrap:wrap}
.hotel .money .pend{color:var(--due);font-weight:600}
.hotel .note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;white-space:pre-wrap}
.add-slot{border:1.5px dashed var(--line);border-radius:var(--r);background:transparent;padding:14px;color:var(--muted);cursor:pointer;font-weight:600;font-size:13px;width:100%}
.add-slot:hover{border-color:var(--sec);color:var(--sec)}
@media (max-width:1100px){.night{grid-template-columns:minmax(0,1fr)}.night-date{display:flex;gap:10px;align-items:baseline;padding-top:0}}

/* panels/tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h3{font-size:19px;text-transform:uppercase}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.tagno{display:inline-grid;place-items:center;min-width:38px;height:30px;padding:0 6px;border-radius:7px;background:var(--s-room);color:#1b1300;font-family:var(--f-mono);font-weight:600;font-size:15px}
.docs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.doc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:7px;padding:2px 4px 2px 8px;font-size:12.5px;max-width:230px;background:var(--sunk)}
.doc a{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc a:hover{text-decoration:underline}
.doc button{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.doc button.armed{color:var(--due);font-weight:700;font-size:12px}
.nodoc{font-size:12.5px;color:var(--due);font-weight:600}
.send{margin-top:18px;padding:16px;display:grid;gap:14px}
.send-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.mailbox{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;background:var(--sunk);font-family:var(--f-mono);font-size:13px;user-select:all;min-width:0;max-width:100%}
.mailbox span{overflow:hidden;text-overflow:ellipsis}
.hint{font-size:12.5px;color:var(--muted);max-width:70ch}

/* gastos */
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.cat{border:0;border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;background:var(--cbg);color:var(--ink);display:flex;flex-direction:column;gap:2px;border:2px solid transparent}
.cat.on{border-color:var(--cc)}
.cat b{font-family:var(--f-display);font-size:16px;text-transform:uppercase;color:var(--cc);letter-spacing:.03em}
.cat .v{font-family:var(--f-mono);font-weight:600;font-size:19px}
.cat small{color:var(--muted);font-size:12px}
.c-comida{--cc:var(--s-gas);--cbg:var(--s-gas-bg)} .c-repostaje{--cc:var(--s-hot);--cbg:var(--s-hot-bg)} .c-hotel{--cc:var(--s-bal);--cbg:var(--s-bal-bg)}
.c-super{--cc:var(--s-com);--cbg:var(--s-com-bg)} .c-bicis{--cc:var(--s-room);--cbg:var(--s-room-bg)} .c-vehiculo{--cc:var(--half);--cbg:var(--half-bg)} .c-guias{--cc:var(--paid);--cbg:var(--paid-bg)} .c-peaje{--cc:var(--s-cli);--cbg:var(--s-cli-bg)} .c-actividad{--cc:var(--s-eta);--cbg:var(--s-eta-bg)} .c-otros{--cc:var(--muted);--cbg:var(--sunk)}
.gday{margin-bottom:16px}
.gday-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 2px 8px}
.gday-h b{font-family:var(--f-display);font-size:19px;text-transform:uppercase}
.gday-h span{font-family:var(--f-mono);font-weight:600}
.glist{display:flex;flex-direction:column;gap:8px}
.gasto{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--cc);border-radius:var(--r);padding:8px 12px 8px 8px;cursor:pointer;text-align:left;width:100%}
.gasto:hover{box-shadow:var(--shadow)}
.thumb{width:58px;height:58px;border-radius:8px;background:var(--cbg);display:grid;place-items:center;overflow:hidden;color:var(--cc);font-weight:800;font-size:11px;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.miss{background:var(--due-bg);color:var(--due)}
.gasto .gt b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gasto .gt .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.gasto .amt{text-align:right;font-family:var(--f-mono)}
.gasto .amt b{font-size:17px;display:block}
.gasto .amt small{color:var(--muted);font-size:11.5px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:20;border:0;border-radius:99px;padding:14px 20px;font-weight:800;font-size:15px;background:var(--s-gas);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);cursor:pointer}
:root[data-theme="dark"] .fab{color:#1d0e04}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#1d0e04}}
.photo-pick{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border:1.5px dashed var(--s-gas);border-radius:10px;background:var(--s-gas-bg)}
.photo-pick img{width:72px;height:72px;object-fit:cover;border-radius:8px}
.photo-pick .ph{width:72px;height:72px;border-radius:8px;background:var(--surface);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--s-gas);text-align:center}

/* etapas */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage-top{background:var(--stc,var(--s-eta));color:#fff;padding:16px 18px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
:root[data-theme="dark"] .stage-top{color:#08160c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage-top{color:#08160c}}
.stage-top h2{font-size:28px;text-transform:uppercase}
.stage-top span{font-weight:600}
.stage-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line)}
.stage-stats div{background:var(--surface);padding:12px 16px}
.stage-stats .v{font-family:var(--f-mono);font-size:22px;font-weight:600;color:var(--stc,var(--s-eta))}
.stage-top .btn{color:var(--ink);background:var(--surface);border-color:transparent}
.stage-stats .v.txt{font-family:var(--f-body);font-size:16px;line-height:1.35;font-weight:700}
.tipo-chip{display:inline-block;font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.22);border-radius:99px;padding:3px 10px;vertical-align:4px;margin-right:6px}
.day-btn i.t-etapa{background:var(--s-eta)} .day-btn i.t-traslado{background:var(--s-hot)} .day-btn i.t-libre{background:var(--s-bal)}
.day-btn small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-top:1px}
.tipo-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.tipo-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.stage-body{padding:16px 18px;display:grid;gap:16px}
.stage-body h4{margin:0 0 4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.stage-body p{margin:0;white-space:pre-wrap;max-width:75ch;font-size:15px}
.alert{background:var(--due-bg);border-left:5px solid var(--due);border-radius:8px;padding:10px 14px}
.alert p{color:var(--ink)}
.stage-hotel{background:var(--s-hot-bg);border-radius:8px;padding:10px 14px}

/* compra */
.shop-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.shop-add input{flex:1 1 200px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:15px}
.shop-add input.q{flex:0 1 110px}
.shop{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.item .ck{width:28px;height:28px;border-radius:8px;border:2px solid var(--s-com);background:transparent;cursor:pointer;display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 auto}
.item.done{background:var(--s-com-bg);border-color:transparent}
.item.done .ck{background:var(--s-com)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .t{flex:1;font-size:15px;min-width:0}
.item .q{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.item .x{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px;padding:0 4px}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.prog .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog .t b{font-family:var(--f-mono);font-size:20px}
.bar{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.bar.low i{background:var(--due)} .bar.sec i{background:var(--sec)}
.prog .miss{font-size:12.5px;color:var(--due);font-weight:600} .prog .miss.okk{color:var(--ok)}

/* list room */
.lr-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.lr-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px}
.lr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lr-card{background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--due);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center}
.lr-card.s-ent{border-left-color:var(--half);background:linear-gradient(90deg,var(--half-bg),var(--surface) 60%)}
.lr-card.s-all{border-left-color:var(--ok);background:linear-gradient(90deg,var(--ok-bg),var(--surface) 60%)}
.lr-card.s-none{background:linear-gradient(90deg,var(--due-bg),var(--surface) 60%)}
.lr-card .tagno{min-width:48px;height:42px;font-size:20px}
.lr-card .who b{display:block;font-size:15px;line-height:1.2}
.lr-card .who span{font-size:12.5px;color:var(--muted)}
.lr-card .roomline{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.room-in{width:90px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);font-family:var(--f-mono);font-weight:600;font-size:15px}
.lr-card .tgs{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.tg .box{width:16px;height:16px;border:2px solid currentColor;border-radius:4px;display:inline-grid;place-items:center;font-size:11px;line-height:1}
.tg.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tg.on .box{background:#fff;color:var(--ok);border-color:#fff}
.mx{border-collapse:separate;border-spacing:0}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1}
.mx td.c-none{background:var(--due-bg)} .mx td.c-ent{background:var(--half-bg)} .mx td.c-all{background:var(--ok-bg)}
.mx .rm{display:block;font-family:var(--f-mono);font-size:12.5px;font-weight:600;min-height:18px}
.mini{display:inline-flex;gap:4px}
.mini button{width:26px;height:24px;border-radius:5px;border:1.5px solid var(--line);background:var(--surface);font-size:11px;font-weight:700;cursor:pointer;color:var(--muted)}
.mini button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mx tfoot td{font-size:12px;font-weight:600}
.bad{color:var(--due)} .good{color:var(--ok)}

/* balance */
.pay-in{width:110px;border:1px solid var(--line);border-radius:7px;padding:5px 8px;background:var(--surface);font-family:var(--f-mono);text-align:right}
.split{display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--sunk);margin:6px 0 4px}
.split i{display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 100px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px;background:var(--cc)}
.hbar .num{text-align:right}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:900px){.two{grid-template-columns:minmax(0,1fr)}}
.pos{color:var(--ok)} .neg{color:var(--due)}

/* empty + modal */
/* pendientes */
.sec-pend{--sec:var(--due);--sec-bg:var(--due-bg)}
.sec-hoy{--sec:#7ea538;--sec-bg:var(--ok-bg)}
.pend-btn{border-left:5px solid var(--due)!important}
.pend-n{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--due);color:#fff;font-style:normal;font-size:12px;font-weight:700;vertical-align:2px}
.pend-trip{margin-bottom:14px}
.pend-list{display:flex;flex-direction:column}
.pend-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 16px;cursor:pointer;color:var(--ink);font:inherit}
.pend-item:last-child{border-bottom:0}
.pend-item:hover{background:var(--sec-bg)}
.pend-item i{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--muted)}
.pend-item.s-alta i{background:var(--due)} .pend-item.s-media i{background:var(--half)} .pend-item.s-baja i{background:var(--s-hot)}
.pend-item span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pend-item small{color:var(--muted);font-size:12.5px}
.pend-item em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.pend-ok{padding:12px 16px;color:var(--ok);font-weight:600;margin:0}
/* hoy */
.hoy-nav{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;margin-bottom:14px;text-align:center}
.hoy-nav b{display:block;font-size:20px;text-transform:uppercase}
.hoy-nav span{color:var(--muted);text-transform:capitalize}
.hoy-nav .btn{height:44px;font-size:20px;justify-content:center}
.hoy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;align-items:start}
.hoy-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hoy-top{background:var(--stc,var(--ink));color:#fff;padding:14px 16px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hoy-top.plain{background:var(--sec-bg);color:var(--ink)}
.hoy-top h2{font-size:21px;text-transform:uppercase;margin:0}
.hoy-top .tipo-chip{background:rgba(255,255,255,.22);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;text-transform:uppercase}
.hoy-body{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.hoy-body p{margin:0}
.hoy-facts{display:flex;flex-wrap:wrap;gap:8px 18px}
.hoy-facts span{display:flex;flex-direction:column}
.hoy-facts small{color:var(--muted);font-size:12px;text-transform:uppercase}
.hoy-facts b{font-size:18px} .hoy-facts b.bad{color:var(--due)} .hoy-facts b.good{color:var(--ok)}
.hoy-hotel{display:flex;flex-direction:column;gap:4px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.hoy-hotel:last-child{border-bottom:0;padding-bottom:0}
.hoy-hotel b{font-size:17px}
.hoy-body .acts{display:flex;flex-wrap:wrap;gap:8px}
.hoy-bags{display:flex;flex-direction:column;gap:6px}
.hoy-bags>div{display:flex;align-items:center;gap:10px}
.hoy-bags>div>span:nth-child(2){flex:1;min-width:0}
.sec-bicis{--sec:var(--s-bic);--sec-bg:var(--s-bic-bg)}
.bici-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bici-card{background:var(--surface);border:1px solid var(--line);border-left:7px solid var(--s-bic);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.bici-card.off{border-left-color:var(--line);opacity:.8}
.bici-card.ent{background:linear-gradient(90deg,var(--half-bg),var(--surface) 60%)}
.bici-card.dev{background:linear-gradient(90deg,var(--ok-bg),var(--surface) 60%);border-left-color:var(--ok)}
.bici-top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.bici-top b{display:block;line-height:1.2} .bici-top .hint{font-size:12.5px}
.bici-meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.bici-meta .due-txt{color:var(--due);font-weight:600}
.bici-card .tgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bici-res{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px}
.bici-res div{display:flex;flex-direction:column;border:1px solid var(--line);border-top:4px solid var(--s-bic);border-radius:10px;padding:8px 14px;min-width:120px}
.bici-res b{font-family:var(--f-mono);font-size:22px;color:var(--s-bic)} .bici-res small{color:var(--muted)}
.insc-panel{border-left:6px solid var(--due)}
.insc-item{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.insc-item>div:first-child{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.insc-item .acts{display:flex;gap:8px;flex-wrap:wrap}
.slug-in{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.slug-in span{padding:8px 0 8px 10px;color:var(--muted);white-space:nowrap;font-size:13px}
.f .slug-in input{border:0;border-radius:0;padding-left:2px}
.pub-live{background:var(--ok-bg);border-radius:10px;padding:10px 12px;gap:6px}
.pub-live a{word-break:break-all;font-weight:600;color:var(--ok)}
.pub-live .acts{display:flex;gap:8px;flex-wrap:wrap}
.plantilla-box{background:var(--s-bic-bg);border-radius:10px;padding:10px 12px}
.conta-btn{border-left:5px solid var(--s-bal)!important}
.conta-mini{margin-bottom:18px;border-top:5px solid var(--s-bal)}
.tax-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tax-grid>div{border:1px solid var(--line);border-left:5px solid var(--tc);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tax-grid b{font-family:var(--f-mono);font-size:20px;color:var(--tc)} .tax-grid small{color:var(--muted);font-size:12px}
.q-row{display:flex;align-items:center;gap:12px;padding:6px 8px;border-radius:8px}
.q-row.on{background:var(--sec-bg)} .q-row b{width:28px} .q-row .num{min-width:110px;text-align:right;font-weight:700}
.empty{max-width:560px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:28px;text-transform:uppercase}
.overlay{position:fixed;inset:0;background:rgba(10,18,14,.5);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:16px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);border-top:6px solid var(--sec,var(--accent))}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal header h2{font-size:22px;text-transform:uppercase;color:var(--sec,var(--ink))}
.modal form{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--surface);width:100%}
.f textarea{min-height:68px;resize:vertical}
.f.chk{flex-direction:row;align-items:center;gap:8px}
.f.chk input{width:auto}
.calc{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-radius:9px;background:var(--sunk);font-family:var(--f-mono);font-size:13px}
.calc .pend{color:var(--due);font-weight:600} .calc .ok{color:var(--paid);font-weight:600}
.modal footer{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-top:6px}
.modal footer .left{margin-right:auto}
@media (max-width:520px){.modal form{grid-template-columns:1fr}}
.pillset{display:flex;gap:6px;flex-wrap:wrap}
.pillset label{position:relative;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink)}
.pillset input{position:absolute;opacity:0;pointer-events:none}
.pillset label:has(input:checked){border-color:var(--sec);background:var(--sec-bg);color:var(--sec)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.example-flag{font-size:12.5px;background:var(--half-bg);color:var(--half);border-radius:9px;padding:8px 12px;margin-bottom:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const money = n => eur.format(+n || 0);
const fD = new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short"});
const fW = new Intl.DateTimeFormat("es-ES",{weekday:"short"});
const fFull = new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"long",year:"numeric"});
const fLong = new Intl.DateTimeFormat("es-ES",{weekday:"long",day:"numeric",month:"long"});
const parse = s => { if(!s) return null; const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const todayIso = iso(new Date());
const TIPOS = {bici:"Cicloturismo", emtb:"E-bike de montaña", trek:"Trekking", otro:"Otro"};
const CATS = {comida:"Comidas", repostaje:"Repostajes", hotel:"Hoteles", super:"Supermercado", peaje:"Peajes y parking", bicis:"Alquiler de bicis", vehiculo:"Furgonetas", guias:"Pago a guías", actividad:"Actividades", otros:"Otros"};
const CAT_IVA = {comida:10, repostaje:21, hotel:10, super:10, peaje:21, bicis:21, vehiculo:21, guias:21, actividad:21, otros:21};
const CAT_COL = {comida:"s-gas",repostaje:"s-hot",hotel:"s-bal",super:"s-com",peaje:"s-cli",bicis:"s-room",vehiculo:"half",guias:"paid",actividad:"s-eta",otros:"muted"};
const TABS = [["hoy","Hoy"],["hoteles","Hoteles"],["etapas","Programa"],["gastos","Gastos"],["compra","Compra"],["clientes","Clientes"],["room","List Room"],["bicis","Bicis"],["balance","Balance"]];
const pad2 = n => String(n ?? "").padStart(2,"0");
const r2 = n => Math.round((+n||0)*100)/100;
const slug = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"_").replace(/^_|_$/g,"");

const S = {
  db:null, assets:null, downloads:null,
  viajes:[], vid:null, view:"trip", tab:"hoteles",
  hoteles:[], clientes:[], rooming:{}, gastos:[], etapas:{}, compra:{}, unsubs:[],
  day:{}, lrMode:"dia", lrFilter:"todos", gCat:null,
  sendDay:null, modal:null, armed:null, busy:false, loadedTrips:false, general:null, genYear:null
};
try { const t = localStorage.getItem("tbx_tab"); if (t && TABS.some(x=>x[0]===t)) S.tab = t; } catch(e){}

/* ---------- helpers ---------- */
function noches(v){
  const a = parse(v.inicio), b = parse(v.fin);
  if (!a) return [];
  const out = []; const d = new Date(a);
  const end = b && b > a ? b : new Date(a.getTime()+86400000);
  while (d < end && out.length < 60){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
function dias(v){ // every calendar day of the trip, for etapas / gastos / compra
  const a = parse(v.inicio), b = parse(v.fin); if (!a) return [];
  const out=[]; const d=new Date(a); const end = b && b>=a ? b : a;
  while (d <= end && out.length < 61){ out.push(iso(d)); d.setDate(d.getDate()+1); }
  return out;
}
function rangeTxt(v){
  const a = parse(v.inicio), b = parse(v.fin);
  if (!a) return "Sin fechas";
  if (!b) return fD.format(a);
  const n = Math.round((b-a)/86400000)+1;
  return `${fD.format(a)} – ${fD.format(b)} ${b.getFullYear()} · ${n} días`;
}
function tripState(v){
  if (!v.inicio) return "";
  if (todayIso >= v.inicio && todayIso <= (v.fin||v.inicio)) return "live";
  return todayIso < v.inicio ? "next" : "past";
}
function addDays(isoStr, n){ const d = parse(isoStr); d.setDate(d.getDate()+n); return iso(d); }
const nNoches = h => Math.max(1, parseInt(h.noches,10)||1);
const covers = (h, f) => !!h.fecha && !!f && f >= h.fecha && f < addDays(h.fecha, nNoches(h));
const hotelPaid = h => (+h.total||0) > 0 && (+h.pagado||0) >= (+h.total||0) - 0.005;
const pend = h => Math.max(0, (+h.total||0) - (+h.pagado||0));
const trip = () => S.viajes.find(v => v.id === S.vid);
const isAdmin = () => !window.TBX_ME || window.TBX_ME.rol === "admin";
const AO = 'admin-only';
const sortedClients = () => [...S.clientes].sort((a,b) => (+a.num||999)-(+b.num||999) || String(a.nombre).localeCompare(b.nombre));
function roomOf(fecha, cid){ return (S.rooming[fecha] && S.rooming[fecha].c && S.rooming[fecha].c[cid]) || {}; }
const conIva = g => g.conIva !== undefined ? !!g.conIva : g.tipo === "factura";
const ivaParts = g => { const t=+g.total||0, p = conIva(g) ? (+g.iva||0) : 0; const base = p ? t/(1+p/100) : t; return {base:r2(base), cuota:r2(t-base), pct:p}; };
function dayLabel(list, f){ const i = list.indexOf(f); const d = parse(f); return `${i>=0?"Día "+(i+1)+" · ":""}${fW.format(d)} ${fD.format(d)}`; }
function pickDay(key, list){
  let d = S.day[key];
  if (!d || !list.includes(d)) d = list.includes(todayIso) ? todayIso : list[0];
  S.day[key] = d; return d;
}
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 3400); }
function writeErr(e){
  console.warn(e);
  if (e && e.code === "invalid_argument") toast("No tienes permiso para guardar cambios en este CRM.");
  else if (e && e.code === "quota_exceeded") toast("La base de datos está llena: borra viajes antiguos.");
  else toast("No se pudo guardar. Revisa la conexión e inténtalo de nuevo.");
}
const queues = {};
const finPath = cid => `viajes/${S.vid}/finanzas/${cid}`;
function serial(key, fn){ const p = (queues[key] || Promise.resolve()).then(fn); queues[key] = p.catch(()=>{}); return p; }
function mutateDoc(path, fn){
  return serial(path, async () => {
    const ref = S.db.doc(path); const s = await ref.get();
    const cur = s.exists ? JSON.parse(JSON.stringify(s.data())) : {};
    await ref.set(fn(cur));
  });
}
async function uploadFile(f){
  let blob = f, type = f.type || (/\.pdf$/i.test(f.name) ? "application/pdf" : /\.png$/i.test(f.name) ? "image/png" : "image/jpeg");
  if (/^image\/(jpeg|png|webp|heic|heif)/.test(type) && window.createImageBitmap){
    try { // reduce phone photos so tickets stay light but legible
      const bmp = await createImageBitmap(f); const sc = Math.min(1, 2000/Math.max(bmp.width,bmp.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*sc); cv.height = Math.round(bmp.height*sc);
      cv.getContext("2d").drawImage(bmp,0,0,cv.width,cv.height);
      blob = await new Promise(r => cv.toBlob(r,"image/jpeg",0.82)); type = "image/jpeg";
    } catch(e){ blob = f; }
  }
  if (!/^(image\/(jpeg|png|webp)|application\/pdf)$/.test(type)) throw {code:"unsupported_type"};
  const r = await S.assets.upload(blob, {type});
  return {id:r.id, nombre:f.name, tipo:r.contentType, size:r.sizeBytes};
}
function upErr(e, name){ console.warn(e); toast(e.code==="too_large" ? `${name} pesa demasiado (máx. 20 MB).` : e.code==="unsupported_type" ? `${name}: solo se admiten fotos (JPG, PNG) o PDF.` : `No se pudo subir ${name}.`); }

/* ---------- data ---------- */
function setSync(state, txt){ const s = $("#sync"); s.className = "sync " + state; s.querySelector("span").textContent = txt; }
function subscribeTrips(){
  S.db.collection("viajes").onSnapshot(snap => {
    S.viajes = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => String(a.inicio||"9").localeCompare(String(b.inicio||"9")));
    S.loadedTrips = true; setSync("on","Sincronizado");
    if (S.vid && !trip()) closeTrip();
    if (!S.vid && S.view==="trip" && !S._restored){ S._restored = true; let last=null; try{ last = localStorage.getItem("tbx_vid"); }catch(e){}
      if (last && S.viajes.some(v=>v.id===last) && window.innerWidth>860) { openTrip(last, true); } }
    renderAll();
  }, e => { setSync("off","Sin conexión"); console.warn(e); });
}
function closeTrip(){ S.unsubs.forEach(u=>u()); S.unsubs = []; S.vid = null; S.hoteles=[]; S.clientes=[]; S.clientesRaw=[]; S.fin={}; S.rooming={}; S.gastos=[]; S.etapas={}; S.compra={}; S.bicis={}; S.insc=null; S.day={}; }
function openTrip(id, silent){
  S.view = "trip";
  if (S.vid === id) { renderAll(); return; }
  closeTrip(); S.vid = id; S.sendDay = null; S.gCat = null;
  { const v0 = S.viajes.find(x => x.id === id); if (v0 && tripState(v0) === "live" && !isAdmin()) S.tab = "hoy"; }
  try { localStorage.setItem("tbx_vid", id); } catch(e){}
  const base = `viajes/${id}`;
  const sub = (c, fn) => S.unsubs.push(S.db.collection(base+"/"+c).onSnapshot(s => { fn(s); renderMain(); renderTabsOnly(); }, e=>console.warn(e)));
  sub("hoteles", s => S.hoteles = s.docs.map(d=>({id:d.id,...d.data()})));
  S.clientesRaw = []; S.fin = {};
  const mergeFin = () => { S.clientes = S.clientesRaw.map(c => ({...c, ...(S.fin[c.id]||{})})); };
  sub("clientes", s => { S.clientesRaw = s.docs.map(d=>({id:d.id,...d.data()})); mergeFin(); });
  if (isAdmin()) sub("finanzas", s => { const r={}; s.docs.forEach(d=>r[d.id]=d.data()); S.fin = r; mergeFin(); });
  sub("gastos", s => S.gastos = s.docs.map(d=>({id:d.id,...d.data()})));
  sub("rooming", s => { const r={}; s.docs.forEach(d=>r[d.id]=d.data()); S.rooming = r; });
  sub("etapas", s => { const r={}; s.docs.forEach(d=>r[d.id]=d.data()); S.etapas = r; });
  sub("compra", s => { const r={}; s.docs.forEach(d=>r[d.id]=d.data()); S.compra = r; });
  sub("bicis", s => { const r={}; s.docs.forEach(d=>r[d.id]=d.data()); S.bicis = r; });
  if (!silent) { renderAll(); window.scrollTo(0,0); }
}
function renderTabsOnly(){}
async function writeRoom(fecha, cid, patch){
  const ref = S.db.doc(`viajes/${S.vid}/rooming/${fecha}`);
  return serial("r"+fecha, async () => {
    try { await ref.update({c:{[cid]:patch}}); }
    catch(e){
      if (e && e.code === "invalid_argument"){ const snap = await ref.get(); if (snap.exists) throw e; await ref.set({c:{[cid]:patch}}); }
      else throw e;
    }
  }).catch(writeErr);
}

/* ===== ETAPAS ===== */
const TIPO_DIA = {etapa:{lbl:"Etapa", col:"var(--s-eta)"}, traslado:{lbl:"Traslado", col:"var(--s-hot)"}, libre:{lbl:"Día libre", col:"var(--s-bal)"}};
function tipoDia(e){
  e = e || {};
  if (TIPO_DIA[e.tipo]) return e.tipo;
  const t = String(e.titulo||"").toLowerCase();
  if (/traslado|transfer|llegada|regreso al aeropuerto|aeropuerto/.test(t) && !(+e.desnivel)) return "traslado";
  if (/libre|descanso/.test(t) && !(+e.km)) return "libre";
  return "etapa";
}
const cleanTitle = t => String(t||"").replace(/^\s*etapa\s*\d+\s*[·:.\-–]\s*/i, "");
const dayHas = e => !!e && Object.keys(e).some(k => Array.isArray(e[k]) ? e[k].length : !!e[k]);
function etapaNum(ds, f){ // 1, 2, 3… counting only cycling/trekking days that have content
  let n = 0; for (const d of ds){ const e = S.etapas[d]; if (dayHas(e) && tipoDia(e)==="etapa") n++; if (d===f) return n; } return n;
}
function dayTag(ds, f){ const e = S.etapas[f]; if (!dayHas(e)) return ""; const t = tipoDia(e); return t==="etapa" ? `Etapa ${etapaNum(ds,f)}` : TIPO_DIA[t].lbl; }
function viewEtapas(v){
  const ds = dias(v);
  const head = secTitle("Programa del viaje", "Cada día del viaje: etapas, traslados y días libres, con lo necesario para el briefing del día anterior.");
  if (!ds.length) return head + `<div class="empty"><p>Añade las fechas del viaje para crear el programa.</p></div>`;
  const f = pickDay("eta", ds); const e = S.etapas[f] || {}; const i = ds.indexOf(f);
  const hotel = S.hoteles.find(h => covers(h,f) && h.grupo==="clientes");
  const has = dayHas(e); const tipo = tipoDia(e); const T = TIPO_DIA[tipo];
  const stat = (lab, val, unit) => `<div><span class="label">${lab}</span><div class="v ${String(val||"").length>10?"txt":""}">${val!==undefined&&val!==""&&val!==null?esc(val)+(unit?`<small style="font-size:13px;color:var(--muted)"> ${unit}</small>`:""):"—"}</div></div>`;
  const block = (lab, txt) => txt ? `<div><h4>${lab}</h4><p>${esc(txt)}</p></div>` : "";
  const ruta = [e.salida,e.llegada].filter(Boolean).join(" → ");
  const stats = tipo==="etapa" ? `${stat("Distancia", e.km, "km")}${stat("Desnivel +", e.desnivel, "m")}${stat("Hora de salida", e.hora)}${stat("Salida → llegada", ruta)}`
    : tipo==="traslado" ? `${stat("Origen → destino", ruta)}${stat("Hora de encuentro", e.hora)}${stat("Punto de encuentro", e.puntoEncuentro)}${stat("En vehículo", [e.km?e.km+" km":"", e.duracion].filter(Boolean).join(" · "))}`
    : "";
  const tracks = `<div><h4>Tracks de la etapa (GPX, KML, FIT…)</h4><div class="docs">
          ${(e.tracks||[]).map(d => `<span class="doc"><button type="button" data-act="dlTracks" data-f="${f}" data-did="${esc(d.id)}" style="font-size:12.5px;color:var(--ink);padding:0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="Descargar ${esc(d.nombre)}">${esc(d.nombre)}</button>
            <button data-act="delFile" data-kind="track" data-id="${esc(f)}" data-did="${esc(d.id)}" class="${AO} ${S.armed==="doc"+d.id?"armed":""}" aria-label="Quitar track">${S.armed==="doc"+d.id?"¿Quitar?":"×"}</button></span>`).join("")}
          ${(e.tracks||[]).length>1?`<button class="btn sm" data-act="dlTracks" data-f="${f}">Descargar todos (.zip)</button>`:""}
          ${S.assets?`<button class="btn sm ${AO}" data-act="upload" data-kind="track" data-id="${f}">Subir tracks</button>`:""}
          ${(e.tracks||[]).length||S.assets?"":'<span class="hint">Sin tracks.</span>'}</div>
          ${linksOf(e).length?`<div class="docs" style="margin-top:8px">${linksOf(e).map(u => `<a class="btn sm" href="${esc(u)}" target="_blank" rel="noopener">${esc(hostOf(u))} ↗</a>`).join("")}</div>`:""}
          ${(e.tracks||[]).length?'<p class="hint" style="margin-top:6px">Se descargan dentro de un .zip con su nombre original, listos para el GPS o la app.</p>':""}</div>`;
  const picker = dayPicker("eta", ds, d => { const x = S.etapas[d]; return dayHas(x) ? "t-"+tipoDia(x) : ""; })
    .replace(/(<button class="day-btn[^"]*" data-act="day" data-k="eta" data-f="([0-9-]+)">.*?<\/span>)/g, (m, all, d) => { const t = dayTag(ds, d); return t ? `${all}<small>${esc(t)}</small>` : all; });
  return head + `<div class="tipo-legend"><span><i style="background:var(--s-eta)"></i>Etapa</span><span><i style="background:var(--s-hot)"></i>Traslado</span><span><i style="background:var(--s-bal)"></i>Día libre</span></div>` + picker + `
    <div class="stage" style="--stc:${T.col}">
      <div class="stage-top"><h2>${has?`<span class="tipo-chip">${esc(dayTag(ds,f))}</span>`:""}Día ${i+1}${e.titulo?" · "+esc(cleanTitle(e.titulo)):""}</h2><span>${esc(fLong.format(parse(f)))}</span>
        <button class="btn sm ${AO}" data-act="editEtapa" data-f="${f}" style="margin-left:auto">${has?"Editar día":"+ Rellenar día"}</button></div>
      ${has ? `${stats?`<div class="stage-stats">${stats}</div>`:""}
      <div class="stage-body">
        ${e.alertas?`<div class="alert"><h4 style="color:var(--due)">Avisos importantes</h4><p>${esc(e.alertas)}</p></div>`:""}
        ${tipo==="libre" ? block("Propuestas para el día", e.propuestas) : ""}
        ${block(tipo==="etapa"?"Descripción del recorrido":tipo==="traslado"?"Detalles del traslado":"Descripción del día", e.descripcion)}
        ${tipo==="etapa" ? block("Paradas, comidas y avituallamientos", e.paradas) : ""}
        ${block("Notas para el briefing", e.briefing)}
        ${tipo==="etapa" || (e.tracks||[]).length ? tracks : ""}
        ${hotel?`<div class="stage-hotel"><h4>Hotel de clientes esta noche</h4><p><b>${esc(hotel.nombre)}</b>${hotel.ciudad?" · "+esc(hotel.ciudad):""}${hotel.telefono?" · "+esc(hotel.telefono):""}</p></div>`:""}
        <div><h4>Archivos del día (rutómetro, mapas, perfil, billetes…)</h4><div class="docs">${fileChips(e.files, "etapa", f)}
          ${S.assets?`<button class="btn sm ${AO}" data-act="upload" data-kind="etapa" data-id="${f}">Subir archivo</button>`:""}</div></div>
      </div>` : `<div class="stage-body"><p class="hint">Todavía no hay información de este día. Pulsa «Rellenar día» y elige si es una etapa, un traslado o un día libre.</p></div>`}
    </div>`;
}
function linksOf(e){
  const raw = [e.enlace||"", e.enlaces||""].join("\n").split(/[\n\s,]+/).map(x=>x.trim()).filter(Boolean);
  return [...new Set(raw.map(u => /^https?:\/\//i.test(u) ? u : "https://"+u))];
}
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return "Enlace"; } }
function fileChips(files, kind, owner){
  return (files||[]).map(d => `<span class="doc"><a href="/_blob/${esc(d.id)}" target="_blank" rel="noopener" title="${esc(d.nombre)}">${esc(d.nombre)}</a>
    <button data-act="delFile" data-kind="${kind}" data-id="${esc(owner)}" data-did="${esc(d.id)}" class="${AO} ${S.armed==="doc"+d.id?"armed":""}" aria-label="Quitar archivo">${S.armed==="doc"+d.id?"¿Quitar?":"×"}</button></span>`).join("");
}

/* ===== GASTOS ===== */
function gastoTotals(gs){
  const t = {total:0, base:0, iva10:0, iva21:0, ivaOtro:0, sinIva:0, nTicket:0, nFact:0, cat:{}};
  gs.forEach(g => { const p = ivaParts(g); const tot = +g.total||0; t.total+=tot; t.base+=p.base;
    if (g.tipo==="factura") t.nFact++; else t.nTicket++;
    if (p.pct){ if (p.pct===10) t.iva10+=p.cuota; else if (p.pct===21) t.iva21+=p.cuota; else t.ivaOtro+=p.cuota; } else t.sinIva+=tot;
    const c = g.categoria||"otros"; t.cat[c] = t.cat[c]||{n:0,total:0}; t.cat[c].n++; t.cat[c].total+=tot; });
  return t;
}
function viewGastos(v){
  const t = gastoTotals(S.gastos);
  const sinFoto = S.gastos.filter(g=>!g.foto).length;
  const head = secTitle("Gastos del viaje", `Cada ticket o factura con su foto, para que no se pierda ninguno. ${v.espana?"Viaje en España: por defecto se registran como factura con IVA.":"Viaje en el extranjero: por defecto se registran como ticket sin IVA."}`,
    `<button class="btn" data-act="csv" ${S.gastos.length?"":"disabled"}>Descargar Excel (CSV)</button><button class="btn pri" data-act="newGasto">+ Añadir ticket</button>`);
  const cats = Object.keys(CATS).filter(c => t.cat[c] || ["comida","repostaje","hotel"].includes(c));
  const list = S.gastos.filter(g => !S.gCat || (g.categoria||"otros")===S.gCat)
    .sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)) || String(b.creado||"").localeCompare(String(a.creado||"")));
  const byDay = {}; list.forEach(g => (byDay[g.fecha||"Sin fecha"] = byDay[g.fecha||"Sin fecha"] || []).push(g));
  const ds = dias(v);
  return head + `<div class="tiles">
      <div class="tile big" style="--tc:var(--s-gas)"><span class="label">Total gastado</span><span class="v">${money(t.total)}</span><small>${S.gastos.length} gastos registrados</small></div>
      <div class="tile" style="--tc:var(--ink)"><span class="label">Base imponible</span><span class="v">${money(t.base)}</span><small>sin IVA</small></div>
      <div class="tile" style="--tc:var(--s-bal)"><span class="label">IVA 21 %</span><span class="v">${money(t.iva21)}</span><small>soportado</small></div>
      <div class="tile" style="--tc:var(--s-cli)"><span class="label">IVA 10 %</span><span class="v">${money(t.iva10+t.ivaOtro)}</span><small>${t.ivaOtro?"incluye otros tipos":"soportado"}</small></div>
      <div class="tile" style="--tc:var(--muted)"><span class="label">Sin IVA contabilizado</span><span class="v">${money(t.sinIva)}</span><small>${t.nTicket} tickets · ${t.nFact} facturas</small></div>
      <div class="tile" style="--tc:${sinFoto?"var(--due)":"var(--ok)"}"><span class="label">Sin foto</span><span class="v">${sinFoto}</span><small>${sinFoto?"falta adjuntar el ticket":"todos con foto"}</small></div>
    </div>
    <div class="cats">${cats.map(c => `<button class="cat c-${c} ${S.gCat===c?"on":""}" data-act="gCat" data-c="${c}"><b>${CATS[c]}</b><span class="v">${money((t.cat[c]||{}).total)}</span><small>${(t.cat[c]||{}).n||0} gastos</small></button>`).join("")}</div>
    ${S.gCat?`<div style="margin:-6px 0 12px"><button class="btn sm" data-act="gCat" data-c="">Ver todas las categorías</button></div>`:""}
    ${!list.length ? `<div class="empty"><p>${S.gastos.length?"No hay gastos en esta categoría.":"Aún no hay gastos. Pulsa «+ Ticket», haz la foto del ticket y apunta el importe."}</p></div>` :
      Object.keys(byDay).map(f => `<div class="gday"><div class="gday-h"><b>${f==="Sin fecha"?f:esc(dayLabel(ds,f))}</b><span>${money(byDay[f].reduce((a,g)=>a+(+g.total||0),0))}</span></div>
        <div class="glist">${byDay[f].map(gastoRow).join("")}</div></div>`).join("")}`;
}
function gastoRow(g){
  const c = g.categoria||"otros"; const p = ivaParts(g);
  const isImg = g.foto && /^image/.test(g.foto.tipo||"");
  return `<button class="gasto c-${c}" data-act="editGasto" data-id="${esc(g.id)}">
    <div class="thumb ${g.foto?"":"miss"}">${g.foto ? (isImg?`<img src="/_blob/${esc(g.foto.id)}" alt="" loading="lazy">`:"PDF") : "SIN<br>FOTO"}</div>
    <div class="gt"><b>${esc(g.concepto||CATS[c])}</b><div class="row"><span class="chip" style="background:var(--cbg);color:var(--cc)">${CATS[c]}</span>
      ${g.tipo==="factura"?`<span class="chip es">Factura · IVA ${p.pct}%</span>`:'<span class="chip">Ticket sin IVA</span>'}
      ${g.metodo?`<span class="chip">${esc(g.metodo)}</span>`:""}${g.pagadoPor?`<span class="chip">${esc(g.pagadoPor)}</span>`:""}${g.soloAdmin?'<span class="chip due">Solo administrador</span>':""}</div></div>
    <div class="amt"><b>${money(g.total)}</b>${g.tipo==="factura"?`<small>base ${money(p.base)} + IVA ${money(p.cuota)}</small>`:""}</div></button>`;
}

    <div class="shop">${items.map((x,k) => `<div class="item ${x.ok?"done":""}"><button class="ck" data-act="shopTg" data-f="${f}" data-i="${esc(x.id)}" aria-label="Marcar">${x.ok?"✓":""}</button>
      <span class="t">${esc(x.t)}</span>${x.q?`<span class="q">${esc(x.q)}</span>`:""}<button class="x" data-act="shopDel" data-f="${f}" data-i="${esc(x.id)}" aria-label="Quitar">×</button></div>`).join("") || '<p class="hint">Escribe arriba lo que hay que comprar para el picnic de este día.</p>'}</div>`;

  const hotelsDay = S.hoteles.filter(h => covers(h,S.sendDay) && h.grupo==="clientes");

  const cl = cs.filter(c => !c.guia), gu = cs.filter(c => c.guia);

      <td>${c.guia?'<span class="hint">—</span>':consentCell(c)}</td>
      <td><div class="docs">${fileChips(c.docs,"cliente",c.id)}${(c.docs||[]).length?"":'<span class="nodoc">Sin documentación</span>'}
        ${S.assets?`<button class="btn sm ${AO}" data-act="upload" data-kind="cliente" data-id="${esc(c.id)}">Subir PDF</button>`:""}</div></td>

  return secTitle("Clientes y documentación", "Cada cliente con su número de etiqueta, sus maletas y su documentación. Desde aquí se prepara el envío de toda la documentación al hotel de cada noche.",
      `<button class="btn pri ${AO}" data-act="newClient">+ Añadir cliente</button>`) + `
  <div class="tiles">

    <div class="tile" style="--tc:${sinDoc?"var(--due)":"var(--ok)"}"><span class="label">Clientes sin documentación</span><span class="v">${sinDoc}</span></div>

    ${S.assets?"":'<div class="hint" style="padding:10px 16px">Solo las personas con permiso de edición pueden subir documentos.</div>'}

/* consent: one PDF per trip, sent to every client by email (BCC); each client's status sin enviar / enviado / firmado */
function consentCell(c){
  const k = c.consent || {}; const mail = (c.email||"").trim();
  const chip = k.estado==="firmado" ? `<span class="chip okc">Firmado${k.firmado?" "+esc(fD.format(parse(k.firmado))):""}</span>`
    : k.estado==="enviado" ? `<span class="chip es">Enviado${k.enviado?" "+esc(fD.format(parse(k.enviado))):""} · falta firma</span>` : '<span class="chip">Sin enviar</span>';
  const acts = k.estado==="firmado"
    ? `${k.doc?`<a class="btn sm" href="/_blob/${esc(k.doc.id)}" target="_blank" rel="noopener">Ver firmado</a>`:""}<button class="btn ghost sm ${S.armed==="cu"+c.id?"danger armed":""}" data-act="cUndo" data-id="${esc(c.id)}">${S.armed==="cu"+c.id?"¿Quitar firma?":"Deshacer"}</button>`
    : `${S.assets?`<button class="btn sm" data-act="upload" data-kind="firmado" data-id="${esc(c.id)}">Subir firmado</button>`:""}<button class="btn ghost sm" data-act="cFirm" data-id="${esc(c.id)}">Marcar firmado</button>`;
  return `<div class="docs">${chip}${mail?"":'<span class="nodoc">Falta email</span>'}${isAdmin()?acts:""}</div>`;
}
function consentPanel(v, cl){
  const st = c => (c.consent||{}).estado || "";
  const firm = cl.filter(c => st(c)==="firmado"), env = cl.filter(c => st(c)==="enviado"), sin = cl.filter(c => !st(c));
  const noMail = cl.filter(c => !(c.email||"").trim());
  const pend = cl.filter(c => st(c)!=="firmado" && (c.email||"").trim());
  const emails = [...new Set(pend.map(c => c.email.trim()))];
  const subj = `Documento de consentimiento – ${v.nombre}`;
  const body = `Hola,\n\nOs enviamos adjunto el documento de consentimiento del viaje ${v.nombre} (${rangeTxt(v)}).\n\nPor favor, devolvédnoslo firmado respondiendo a este correo antes del comienzo del viaje.\n\nMuchas gracias,\nTRAVEL BIKEX`;
  const href = `mailto:?bcc=${emails.map(encodeURIComponent).join(",")}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`;
  const pct = cl.length ? Math.round(firm.length/cl.length*100) : 0;
  return `<div class="panel send" style="margin:0 0 18px;border-left:6px solid var(--ok)">
    <div style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between"><h3 style="font-size:19px;text-transform:uppercase;color:var(--ok)">Consentimiento firmado</h3>
      <span class="num" style="font-size:20px;font-weight:600">${firm.length} / ${cl.length} firmados</span></div>
    <div class="bar ${firm.length<cl.length?"low":""}"><i style="width:${pct}%"></i></div>
    <div class="send-row"><span class="chip okc">${firm.length} firmados</span><span class="chip es">${env.length} enviados sin firmar</span><span class="chip">${sin.length} sin enviar</span>${noMail.length?`<span class="chip due" title="${esc(noMail.map(c=>c.nombre).join(", "))}">${noMail.length} sin email</span>`:""}</div>
    <div class="send-row"><span class="label">Documento</span>${consentOf(v)?`<span class="doc"><a href="/_blob/${esc(consentOf(v).id)}" target="_blank" rel="noopener">${esc(consentOf(v).nombre)}</a></span>`:'<span class="nodoc">Todavía no has subido el documento</span>'}
      ${S.assets?`<button class="btn sm" data-act="upload" data-kind="plantilla" data-id="x">${consentOf(v)?"Cambiar documento (para todos los viajes)":"Subir documento (PDF)"}</button>`:""}</div>
    ${emails.length?`<div class="send-row"><span class="label">Pendientes de firmar (${emails.length})</span><span class="mailbox"><span>${esc(emails.join(", "))}</span><button class="btn sm" data-act="copy" data-v="${esc(emails.join(", "))}">Copiar emails</button></span></div>

      : `<div class="hint">${firm.length===cl.length?"Todos los clientes han firmado.":"No hay emails de clientes pendientes. Añádelos en «Editar» de cada cliente."}</div>`}

/* ===== LIST ROOM ===== */
// Clients that share a luggage tag number (a couple, a family) form one group: one room, one delivery check, maletas summed.
function tagGroups(){
  const m = new Map();
  sortedClients().filter(c => !c.guia).forEach(c => {
    const k = (+c.num) ? "n"+(+c.num) : "c"+c.id;
    if (!m.has(k)) m.set(k, {key:k, num:c.num, members:[], maletas:0});
    const g = m.get(k); g.members.push(c); g.maletas += (+c.maletas||0);
  });
  return [...m.values()];
}
function roomOfG(f, g){
  const c = (S.rooming[f]||{}).c || {};
  return c[g.key] || g.members.map(x => c[x.id]).find(Boolean) || {};
}
function writeRoomG(f, g, patch){
  const c = (S.rooming[f]||{}).c || {};
  const full = c[g.key] ? patch : {...roomOfG(f,g), ...patch}; // first write under the group key carries over older per-client data
  return writeRoom(f, g.key, full);
}
const gNames = g => g.members.map(x => x.nombre).join(" · ");
const gShort = g => g.members.map(x => String(x.nombre).split(" ")[0]).join(" y ");
function dayStats(f, gs){
  let ent=0, rec=0, mE=0, mT=0;
  gs.forEach(g => { const r = roomOfG(f,g); mT += g.maletas; if (r.ent){ ent++; mE += g.maletas; } if (r.rec) rec++; });
  return {ent, rec, mE, mT, n:gs.length};
}

function matrix(ns, gs){
  const head = ns.map((f,i)=>`<th>Noche ${i+1}<br><span style="font-weight:500;text-transform:none;letter-spacing:0">${fW.format(parse(f))} ${fD.format(parse(f))}</span></th>`).join("");

// Client payments live in c.pagos [{id, fecha, importe, metodo, nota}]; older records may only have a c.cobrado total.
const cobradoOf = c => (c.pagos && c.pagos.length) ? r2(c.pagos.reduce((a,p)=>a+(+p.importe||0),0)) : (+c.cobrado||0);
function pagosOf(c){
  const ps = [...(c.pagos||[])];
  if (!ps.length && +c.cobrado) ps.push({id:"legacy", fecha:"", importe:+c.cobrado, metodo:"", nota:"Pagado antes de usar el registro de pagos"});
  return ps.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
}
function payChip(c){
  const precio = +c.precio||0, cob = cobradoOf(c);
  if (!precio && !cob) return '<span class="chip">Sin precio</span>';
  if (precio && cob >= precio - 0.005) return `<span class="chip okc">Pagado ${money(cob)}</span>`;
  return `<span class="chip due">Pagado ${money(cob)} de ${money(precio)}</span>`;
}
function tripFinance(clientes, hoteles, gastos){
  clientes = clientes.filter(c => !c.guia);
  const precio = clientes.reduce((a,c)=>a+(+c.precio||0),0), cobrado = clientes.reduce((a,c)=>a+cobradoOf(c),0);
  const hot = hoteles.reduce((a,h)=>a+(+h.total||0),0);
  const gt = gastoTotals(gastos);
  const gastosTot = hot + gt.total;
  return {precio, cobrado, porCobrar:Math.max(0,precio-cobrado), hot, gastosTk:gt.total, gt, gastosTot, balance:cobrado-gastosTot, previsto:precio-gastosTot};
}

async function loadGeneral(){
  S.general = {loading:true, rows:[]}; renderMain();
  const rows = [];
  for (const v of S.viajes){
    try {
      const base = `viajes/${v.id}`;
      const [c,h,g,fz] = await Promise.all(["clientes","hoteles","gastos","finanzas"].map(x => S.db.collection(base+"/"+x).get()));
      const fm = {}; fz.docs.forEach(d => fm[d.id] = d.data());
      const F = tripFinance(c.docs.map(d=>({...d.data(), ...(fm[d.id]||{})})), h.docs.map(d=>d.data()), g.docs.map(d=>d.data()));
      rows.push({v, F});
    } catch(e){ console.warn(e); }
  }
  S.general = {loading:false, rows, at:new Date()}; if (S.view==="general") renderMain();
}

const daysTo = d => d ? Math.round((parse(d) - parse(todayIso)) / 86400000) : null;
function tripWhen(v){
  const n = daysTo(v.inicio), st = tripState(v);
  if (st === "live") return {txt:"En curso", cls:"live"};
  if (st === "past") return {txt:"Terminado", cls:""};
  if (n === null) return {txt:"Sin fechas", cls:""};
  return {txt: n === 0 ? "Empieza hoy" : n === 1 ? "Empieza mañana" : `Empieza en ${n} días`, cls: n <= 30 ? "due" : "es"};
}
async function loadPend(){
  S.pend = {loading:true, trips:[]}; if (S.view==="pend" || !S.vid) renderMain();
  const out = [];
  const relevant = S.viajes.filter(v => !v.fin || daysTo(v.fin) >= -30);
  for (const v of relevant){
    try {
      const base = `viajes/${v.id}`;
      const [h, c, fz, e] = await Promise.all(["hoteles","clientes","finanzas","etapas"].map(x => S.db.collection(base+"/"+x).get()));
      const hoteles = h.docs.map(d => ({id:d.id, ...d.data()}));
      const fm = {}; fz.docs.forEach(d => fm[d.id] = d.data());
      const cls = c.docs.map(d => ({id:d.id, ...d.data(), ...(fm[d.id]||{})})).filter(x => !x.guia);
      const et = {}; e.docs.forEach(d => et[d.id] = d.data());
      const n = daysTo(v.inicio), soon = n !== null && n <= 30 && tripState(v) !== "past";
      const sev = soon || tripState(v) === "live" ? "alta" : "media";
      const items = [];
      hoteles.filter(x => !hotelPaid(x)).forEach(x => items.push({sev, tab:"hoteles", txt: (+x.total||0) ? `${x.nombre||"Hotel"}: falta pagar ${money(pend(x))}` : `${x.nombre||"Hotel"}: sin importe apuntado`, sub: x.fecha ? `Noche del ${fD.format(parse(x.fecha))}${x.grupo==="guias"?" · guías":""}` : ""}));
      const ns = noches(v); const sinHotel = ns.filter(f => !hoteles.some(x => covers(x,f) && x.grupo==="clientes"));
      if (sinHotel.length) items.push({sev, tab:"hoteles", txt:`${sinHotel.length} noche${sinHotel.length>1?"s":""} sin hotel de clientes`, sub: sinHotel.slice(0,4).map(f => fD.format(parse(f))).join(", ")});
      cls.filter(x => (+x.precio||0) - cobradoOf(x) > 0.005).forEach(x => items.push({sev: soon && n <= 30 ? "alta" : "media", tab:"balance", txt:`${x.nombre}: le faltan ${money((+x.precio||0) - cobradoOf(x))}`, sub:"Pago del cliente"}));
      if (cls.length && !consentOf(v)) items.push({sev:"media", tab:"clientes", txt:"Falta subir el documento de consentimiento"});
      const noFirm = cls.filter(x => ((x.consent||{}).estado||"") !== "firmado");
      if (noFirm.length) items.push({sev, tab:"clientes", txt:`${noFirm.length} cliente${noFirm.length>1?"s":""} sin consentimiento firmado`, sub: noFirm.slice(0,5).map(x => x.nombre).join(", ") + (noFirm.length>5?"…":"")});
      const noMail = cls.filter(x => !(x.email||"").trim());
      if (noMail.length) items.push({sev:"media", tab:"clientes", txt:`${noMail.length} cliente${noMail.length>1?"s":""} sin email`, sub:"Necesario para enviar el consentimiento"});
      const noDoc = cls.filter(x => !(x.docs||[]).length);
      if (noDoc.length) items.push({sev, tab:"clientes", txt:`${noDoc.length} cliente${noDoc.length>1?"s":""} sin documentación`, sub: noDoc.map(x => x.nombre).join(", ")});
      const vacios = dias(v).filter(f => !dayHas(et[f]));
      if (vacios.length) items.push({sev:"media", tab:"etapas", txt:`${vacios.length} día${vacios.length>1?"s":""} del programa sin rellenar`});
      if (!(v.guias||[]).length && tripState(v) !== "past") items.push({sev:"baja", tab:null, act:"editTrip", txt:"Sin guías asignados al viaje"});
      out.push({v, items});
    } catch(err){ console.warn(err); }
  }
  out.sort((a,b) => String(a.v.inicio||"9").localeCompare(String(b.v.inicio||"9")));
  S.pend = {loading:false, trips:out, at:new Date()};
  renderSide(); if (S.view==="pend" || !S.vid) renderMain();
}

async function trackBlob(d){
  const res = await fetch("/_blob/" + d.id); if (!res.ok) throw new Error("track no encontrado");

  if (d.enc !== "b64" && /^\s*</.test(txt)) return new Blob([txt]);
  const bin = atob(txt.trim()); const u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8]);
}

async function firmaPdf(v, d){
  const {PDFDocument, rgb, StandardFonts} = PDFLib;
  let pdf;
  if (consentOf(v)){ try { pdf = await PDFDocument.load(await (await fetch("/_blob/" + consentOf(v).id)).arrayBuffer(), {ignoreEncryption:true}); } catch(e){ console.warn(e); } }
  if (!pdf) pdf = await PDFDocument.create();
  const fR = await pdf.embedFont(StandardFonts.Helvetica), fB = await pdf.embedFont(StandardFonts.HelveticaBold);
  const clean = t => String(t ?? "").replace(/[^\x20-\x7E -ÿ€–—‘’“”•…]/g, "");
  const pg = pdf.addPage([595.28, 841.89]); let y = 780;
  const line = (t, size=11, font=fR) => { pg.drawText(clean(t), {x:50, y, size, font, color:rgb(.1,.1,.1), maxWidth:495, lineHeight:size*1.35}); y -= size*1.35*Math.max(1, Math.ceil(fR.widthOfTextAtSize(clean(t), size)/495)) + 4; };
  line("TRAVEL BIKEX · Firma del consentimiento", 16, fB); y -= 6;
  line(`Viaje: ${v.nombre} (${rangeTxt(v)})`);
  line(`Nombre: ${d.nombre||""}`); if (d.documento) line(`DNI / pasaporte: ${d.documento}`);
  if (d.email) line(`Email: ${d.email}`); if (d.telefono) line(`Teléfono: ${d.telefono}`);
  y -= 8;
  (d.aceptaciones||[]).forEach(t => line(`[X] ${t}`, 10));
  y -= 8; line(`Firmado electrónicamente el ${d.firmadoEn ? new Date(d.firmadoEn).toLocaleString("es-ES") : ""} desde el formulario de inscripción online.`, 10);
  if (d.firma && /^data:image\/png;base64,/.test(d.firma)){
    const img = await pdf.embedPng(d.firma); const w = Math.min(300, img.width), h = img.height * w / img.width;
    y -= h + 10; pg.drawRectangle({x:48, y:y-4, width:w+4, height:h+8, borderColor:rgb(.6,.6,.6), borderWidth:.6}); pg.drawImage(img, {x:50, y, width:w, height:h});
    y -= 16; pg.drawText("Firma", {x:50, y, size:9, font:fR, color:rgb(.4,.4,.4)});
  }
  return new Blob([await pdf.save()], {type:"application/pdf"});
}
